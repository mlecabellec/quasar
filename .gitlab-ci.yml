stages:
  - build_and_test

.build_template:
  stage: build_and_test
  before_script:
    - apt-get update
    - apt-get install -y cmake g++ make git pkg-config python3 file autoconf automake libtool linux-headers-amd64 libcurl4-openssl-dev
  script:
    - echo "Building cmake-projects..."
    - cmake -S cmake-projects -B build-projects
    - cmake --build build-projects
    - echo "Running tests..."
    - ctest --test-dir build-projects --output-on-failure -E "(ScriptManagerTest\.MemoryStress|LuaServiceTest\.FullLifecycle)"
    - echo "Packaging..."
    - cd build-projects && cpack -G DEB
    - echo "Configuring linux-modules..."
    - cd ..
    - cmake -S linux-modules -B build-modules
    # Note: explicit build of linux-modules is skipped due to potential kernel mismatch in CI containers

  artifacts:
    paths:
      - build-projects/*.deb
    expire_in: 1 week

debian-bookworm:
  image: debian:bookworm
  extends: .build_template

debian-trixie:
  image: debian:trixie
  extends: .build_template

.stress_test_template:
  stage: build_and_test
  allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y cmake g++ make git pkg-config python3 libcurl4-openssl-dev gdb
  script:
    - echo "Building cmake-projects for stress test..."
    - cmake -S cmake-projects -B build-projects
    - cmake --build build-projects
    - echo "Running stress test in GDB..."
    # We use -batch to run non-interactively and -ex to pass commands
    - gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"

stress-test-bookworm:
  image: debian:bookworm
  extends: .stress_test_template

stress-test-trixie:
  image: debian:trixie
  extends: .stress_test_template
