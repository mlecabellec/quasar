name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["debian:bookworm", "debian:trixie"]

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Pre-install git for checkout
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ccache cmake g++ make git pkg-config python3 file linux-headers-amd64 \
                             libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
                             libgmp-dev libssl-dev libsasl2-dev libzstd-dev uuid-dev binutils-dev zlib1g-dev libiberty-dev libcurl4-openssl-dev
          # Attempt to install headers for the running kernel if possible, 
          # but in a container on GHA this is usually not matching the distro repo.
          # We install the default headers for the distro to allow compilation 
          # if the build system allows specifying the KERNELDIR.

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ matrix.container }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.container }}-ccache-

      - name: Configure CMake Projects
        run: |
          mkdir -p .ccache
          cmake -S cmake-projects -B build-projects \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Build CMake Projects
        run: |
          ccache -z
          cmake --build build-projects
          ccache -s
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Test CMake Projects
        run: ctest --test-dir build-projects --output-on-failure -E "(ScriptManagerTest\.MemoryStress|LuaServiceTest\.FullLifecycle)"

      - name: Package (Debian)
        run: |
          cd build-projects
          cpack -G DEB

      - name: Generate Safe Artifact Name
        id: artifact-name
        run: |
          SAFE_NAME=$(echo "${{ matrix.container }}" | tr ':' '-')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: quasar-deb-${{ steps.artifact-name.outputs.safe_name }}
          path: build-projects/*.deb

      - name: Prepare Linux Modules (EtherCAT)
        # This step might fail if the kernel headers don't match uname -r
        # We will try to configure it.
        continue-on-error: true
        run: |
          # Install autotools for ethercat bootstrap
          apt-get install -y autoconf automake libtool

          # Configure the top level linux-modules
          # Note: linux-modules/CMakeLists.txt adds subdirectories.
          # ethercat/CMakeLists.txt runs ./bootstrap and ./configure

          cmake -S linux-modules -B build-modules

          # We don't run build here because it will invoke 'make modules' 
          # which will likely fail due to kernel version mismatch in container.
          # But we can try to see if cmake configuration passes.

  stress-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["debian:bookworm", "debian:trixie"]
    
    container:
      image: ${{ matrix.container }}

    continue-on-error: true # Allow this job to fail without failing the whole pipeline

    steps:
      - name: Pre-install git for checkout
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake g++ make git pkg-config python3 libcurl4-openssl-dev gdb

      - name: Configure CMake Projects
        run: cmake -S cmake-projects -B build-projects

      - name: Build CMake Projects
        run: cmake --build build-projects

      - name: Run Stress Tests in GDB
        run: |
          # We use -batch to run non-interactively and -ex to pass commands
          gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"
