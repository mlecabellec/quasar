name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: "debian:bookworm"
            optional: false
          - container: "debian:trixie"
            optional: false
          - container: "fedora:latest"
            optional: true
          - container: "archlinux:latest"
            optional: true

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Pre-install git for checkout (Debian/Fedora)
        if: "!contains(matrix.container, 'archlinux')"
        run: |
          if command -v apt-get > /dev/null; then
            apt-get update && apt-get install -y git
          elif command -v dnf > /dev/null; then
            dnf install -y git
          fi

      - name: Pre-install git for checkout (Arch)
        if: "contains(matrix.container, 'archlinux')"
        run: |
          pacman -Sy --noconfirm git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Debian)
        if: "startsWith(matrix.container, 'debian')"
        run: |
          apt-get update
          apt-get install -y ccache cmake g++ make git pkg-config python3 file linux-headers-amd64 \
                             libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
                             libgmp-dev libssl-dev libsasl2-dev libzstd-dev uuid-dev binutils-dev zlib1g-dev libiberty-dev libcurl4-openssl-dev gdb

      - name: Install dependencies (Fedora)
        if: "startsWith(matrix.container, 'fedora')"
        run: |
          dnf install -y gcc-c++ make cmake git pkgconf-pkg-config python3 file \
                         kernel-devel autoconf automake libtool dkms \
                         alsa-lib-devel libX11-devel libXrandr-devel libXi-devel \
                         mesa-libGL-devel mesa-libGLU-devel libXcursor-devel libXinerama-devel \
                         gmp-devel openssl-devel libuuid-devel zlib-devel binutils-devel \
                         yaml-cpp-devel tinyxml2-devel ccache gdb

      - name: Install dependencies (Arch)
        if: "startsWith(matrix.container, 'archlinux')"
        run: |
          pacman -S --needed --noconfirm \
                         base-devel cmake git python file \
                         linux-headers autoconf automake libtool dkms \
                         alsa-lib libx11 libxrandr libxi mesa glu libxcursor libxinerama \
                         gmp openssl util-linux-libs zlib binutils yaml-cpp tinyxml2 ccache gdb

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ matrix.container }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.container }}-ccache-

      - name: Configure CMake Projects
        run: |
          mkdir -p .ccache
          cmake -S cmake-projects -B build-projects \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_POLICY_DEFAULT_CMP0000=NEW
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Build CMake Projects
        run: |
          ccache -z
          cmake --build build-projects
          ccache -s
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Test CMake Projects
        run: ctest --test-dir build-projects --output-on-failure --repeat until-pass:99

      - name: Run Stress Tests in GDB
        continue-on-error: true
        run: |
          # We use -batch to run non-interactively and -ex to pass commands
          gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"

      - name: Package (Debian/RPM)
        run: |
          cd build-projects
          if command -v dpkg > /dev/null; then
            cpack -G DEB
          elif command -v rpmbuild > /dev/null; then
            cpack -G RPM
          else
            cpack -G TGZ
          fi

      - name: Generate Safe Artifact Name
        id: artifact-name
        run: |
          SAFE_NAME=$(echo "${{ matrix.container }}" | tr ':' '-')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quasar-pkg-${{ steps.artifact-name.outputs.safe_name }}
          path: |
            build-projects/*.deb
            build-projects/*.rpm
            build-projects/*.tar.gz

      - name: Prepare Linux Modules (EtherCAT)
        # This step might fail if the kernel headers don't match uname -r
        continue-on-error: true
        run: |
          # Install autotools if missing (Debian)
          if command -v apt-get > /dev/null; then
            apt-get install -y autoconf automake libtool
          fi

          cmake -S linux-modules -B build-modules
