name: Build & Publish Documentation (Gitea)

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Documentation Site & PDF Manual
    runs-on: ubuntu-latest
    if: >-
      (startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr') ||
      gitea.event_name == 'workflow_dispatch') &&
      (gitea.event_name == 'workflow_dispatch' ||
      startsWith(gitea.ref, 'refs/tags/') ||
      contains(gitea.event.head_commit.message, 'RUN_WORKFLOW') ||
      contains(gitea.event.commits[0].message, 'RUN_WORKFLOW') ||
      contains(gitea.event.pull_request.title, 'RUN_WORKFLOW') ||
      contains(gitea.event.head_commit.message, 'RELEASE_ARTIFACTS') ||
      contains(gitea.event.commits[0].message, 'RELEASE_ARTIFACTS'))

    steps:
      - name: "Diagnostic: Environment, Runner & Container Socket Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 01] Diagnostic: Environment, Runner & Container Socket Context ==="
            echo "=== UTC Timestamp ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "=== Host / Container OS & Hardware ==="
            cat /etc/os-release 2>/dev/null || true
            uname -a
            hostname -f 2>/dev/null || hostname || true
            id
            pwd
            nproc || true
            free -h || true
            df -hT . || true
            cat /run/.containerenv 2>/dev/null || ls -la /.dockerenv 2>/dev/null || true
            cat /proc/1/cgroup 2>/dev/null || true
            ls -la /var/run/docker.sock /run/podman/podman.sock 2>/dev/null || true
            docker images --all 2>/dev/null || true
            echo "=== Runner & Job Context ==="
            printf '%s\n' "$CTX_RUNNER"
            printf '%s\n' "$CTX_JOB"
            echo "=== Strategy / Matrix Context ==="
            printf '%s\n' "$CTX_STRATEGY"
            printf '%s\n' "$CTX_MATRIX"
            echo "=== Gitea Context (token redacted) ==="
            printf '%s\n' "$CTX_GITEA" | sed -E 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'
            echo "=== Environment Variables (single-line sorted, sensitive values redacted) ==="
            python3 - <<'PY'
          import os, re
          pat = re.compile(r'(TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)', re.I)
          for k in sorted(os.environ):
              if k.startswith("CTX_"):
                  continue
              v = "***" if pat.search(k) else os.environ[k].replace("\n", "\\n")
              print(f"{k}={v}")
          PY
            if ! command -v node >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
              SUDO=""
              [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
              $SUDO apt-get update
              $SUDO apt-get install -y --no-install-recommends nodejs git ca-certificates
            fi
          ) 2>&1 | tee -a "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-docs-full-execution.log"
          cp -f "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-docs-01-first-analysis.log"

      - name: Push First Analysis Step Logs
        id: push-first-analysis-logs
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-upload-artifact@v4
        with:
          name: quasar-docs-logs-first-analysis
          path: /tmp/quasar-ci-logs-docs/quasar-docs-01-first-analysis.log
          overwrite: true
          if-no-files-found: warn
          retention-days: 7

      - name: Checkout Repository
        id: checkout-repository
        uses: https://gitea.com/actions/checkout@v4

      - name: Checkout MkDocs Kit
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 02] Push First Analysis Step Logs Action Status ==="
            echo "outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
          } | tee -a "$LOG_DIR/02-action-push-first-analysis-logs.log" "$LOG_DIR/quasar-docs-full-execution.log"
          {
            echo "=== [STEP 03] Checkout Repository Action Status ==="
            echo "outcome=${{ steps.checkout-repository.outcome }} conclusion=${{ steps.checkout-repository.conclusion }}"
          } | tee -a "$LOG_DIR/03-action-checkout-repository.log" "$LOG_DIR/quasar-docs-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 04] Checkout MkDocs Kit ==="
            rm -rf mkdocs-kit
            git clone --depth=1 --verbose https://github.com/mlecabellec/mkdocs-kit.git mkdocs-kit
            git -C mkdocs-kit log -1 --oneline || true
          ) 2>&1 | tee -a "$LOG_DIR/04-checkout-mkdocs-kit.log" "$LOG_DIR/quasar-docs-full-execution.log"

      - name: "Diagnostic: Workspace, Git & Toolchain Check"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 05] Diagnostic: Workspace, Git & Toolchain Check ==="
            ls -la
            ls -la doc/ 2>/dev/null || true
            git status -sb || true
            git remote -v || true
            git log -n 5 --oneline --decorate || true
            for cmd in node git python3 pip3 cmake gcc g++ make java mvn podman docker curl plantuml dot; do
              if command -v "$cmd" >/dev/null 2>&1; then
                printf "%-10s %s\n" "$cmd:" "$(command -v "$cmd")"
              else
                printf "%-10s missing\n" "$cmd:"
              fi
            done
          ) 2>&1 | tee -a "$LOG_DIR/05-diagnostic-workspace-toolchain.log" "$LOG_DIR/quasar-docs-full-execution.log"

      - name: Install System Dependencies
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 06] Install System Dependencies ==="
            SUDO=""
            [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends plantuml graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libjpeg-dev libopenjp2-7-dev libffi-dev libxml2-dev libxslt1-dev default-jre-headless
            plantuml -version || true
            dot -V || true
            java -version 2>&1 || true
          ) 2>&1 | tee -a "$LOG_DIR/06-install-system-dependencies.log" "$LOG_DIR/quasar-docs-full-execution.log"

      - name: Set up Python
        id: setup-python
        uses: https://gitea.com/actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Diagnostic: Python Environment Check"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 07] Set up Python Action Status ==="
            echo "outcome=${{ steps.setup-python.outcome }} conclusion=${{ steps.setup-python.conclusion }}"
          } | tee -a "$LOG_DIR/07-action-setup-python.log" "$LOG_DIR/quasar-docs-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 08] Diagnostic: Python Environment Check ==="
            python --version
            pip --version
            pip list
          ) 2>&1 | tee -a "$LOG_DIR/08-diagnostic-python-env.log" "$LOG_DIR/quasar-docs-full-execution.log"

      - name: Install Python Dependencies
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 09] Install Python Dependencies ==="
            pip install -v --upgrade pip
            pip install -v "setuptools<82.0.0"
            pip install -v ./mkdocs-kit
            pip list
          ) 2>&1 | tee -a "$LOG_DIR/09-install-python-dependencies.log" "$LOG_DIR/quasar-docs-full-execution.log"

      - name: Build Documentation
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 10] Build Documentation ==="
            cd doc
            ls -la
            PYTHONPATH="$(pwd)/../mkdocs-kit/src" python ../helpers/build_docs_with_pdf_links.py build -v || mkdocs-kit build -v
            cp -f mkdocs-kit.log "$LOG_DIR/10-mkdocs-kit-internal.log" 2>/dev/null || true
            tail -n 120 mkdocs-kit.log 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/10-build-documentation.log" "$LOG_DIR/quasar-docs-full-execution.log"

      - name: "Diagnostic: Pre-Upload Documentation Artifacts Inventory"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR" release-assets
          (
            set -x
            echo "=== [STEP 11] Diagnostic: Pre-Upload Documentation Artifacts Inventory ==="
            ls -lh doc/documentation.pdf doc/mkdocs-kit.log 2>/dev/null || true
            ls -la doc/site/ 2>/dev/null || true
            du -sh doc/site/ 2>/dev/null || true
            if [ -d doc/site ]; then
              tar -czf release-assets/quasar-docs-site.tar.gz -C doc site
            fi
            if [ -f doc/documentation.pdf ]; then
              cp -f doc/documentation.pdf release-assets/quasar-documentation.pdf
            fi
            if [ -f doc/mkdocs-kit.log ]; then
              cp -f doc/mkdocs-kit.log release-assets/quasar-mkdocs-kit.log
              cp -f doc/mkdocs-kit.log "$LOG_DIR/10-mkdocs-kit-internal.log"
            fi
            ls -lh release-assets/ 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/11-pre-upload-inventory.log" "$LOG_DIR/quasar-docs-full-execution.log"

      - name: Upload Documentation Site Artifact
        id: upload-docs-site
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-upload-artifact@v4
        with:
          name: quasar-docs-site
          path: |
            doc/site/
            release-assets/quasar-docs-site.tar.gz
          overwrite: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload PDF Manual Artifact
        id: upload-docs-pdf
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-upload-artifact@v4
        with:
          name: quasar-docs-pdf
          path: |
            doc/documentation.pdf
            doc/mkdocs-kit.log
          overwrite: true
          if-no-files-found: warn
          retention-days: 7

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-docs"
          mkdir -p "$LOG_DIR" ci-logs
          if [ -f doc/mkdocs-kit.log ]; then
            cp -f doc/mkdocs-kit.log "$LOG_DIR/10-mkdocs-kit-internal.log" 2>/dev/null || true
          fi
          {
            echo "=== [STEP 12 & 13] Action Steps Summary ==="
            echo "push-first-analysis-logs: outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
            echo "checkout-repository:      outcome=${{ steps.checkout-repository.outcome }} conclusion=${{ steps.checkout-repository.conclusion }}"
            echo "setup-python:             outcome=${{ steps.setup-python.outcome }} conclusion=${{ steps.setup-python.conclusion }}"
            echo "upload-docs-site:         outcome=${{ steps.upload-docs-site.outcome }} conclusion=${{ steps.upload-docs-site.conclusion }}"
            echo "upload-docs-pdf:          outcome=${{ steps.upload-docs-pdf.outcome }} conclusion=${{ steps.upload-docs-pdf.conclusion }}"
          } | tee -a "$LOG_DIR/12-action-upload-docs-artifacts.log" "$LOG_DIR/quasar-docs-full-execution.log"
          (
            echo "=== [STEP 14] Diagnostic: Post-Run Summary ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "Job Status: ${{ job.status }}"
            free -h || true
            df -h . || true
            du -sh * doc/site 2>/dev/null || true
            ls -la
            ls -lh "$LOG_DIR" || true
          ) 2>&1 | tee -a "$LOG_DIR/14-post-run-summary.log" "$LOG_DIR/quasar-docs-full-execution.log"
          cp -f "$LOG_DIR"/*.log ci-logs/ 2>/dev/null || true
          tar -czf ci-logs/quasar-docs-full-logs.tar.gz -C "$LOG_DIR" .
          ls -lh ci-logs/

      - name: Push Full Execution Logs
        id: push-full-execution-logs
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-upload-artifact@v4
        with:
          name: quasar-docs-logs-full
          path: |
            ci-logs/quasar-docs-full-execution.log
            ci-logs/quasar-docs-full-logs.tar.gz
            ci-logs/*.log
          overwrite: true
          if-no-files-found: warn
          retention-days: 7

      - name: "Release: Publish Artifacts to Gitea Tag Release"
        if: success() && startsWith(gitea.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_RELEASE_TOKEN || secrets.GITEA_CLEANUP_TOKEN || gitea.token }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPO: ${{ gitea.repository }}
          TAG_NAME: ${{ gitea.ref_name }}
          RELEASE_PATHS: |
            release-assets/quasar-docs-site.tar.gz
            doc/documentation.pdf
        run: |
          if [ -z "${GITEA_TOKEN:-}" ] || ! command -v python3 >/dev/null 2>&1; then
            echo "Release skipped: missing GITEA_TOKEN or python3."
            exit 0
          fi
          python3 - <<'PY'
          import glob, json, mimetypes, os, urllib.error, urllib.parse, urllib.request, uuid

          token = os.environ.get("GITEA_TOKEN", "").strip()
          api = os.environ.get("GITEA_API_URL", "").rstrip("/")
          repo = os.environ.get("GITEA_REPO", "").strip("/")
          tag = os.environ.get("TAG_NAME", "").strip()
          raw_paths = os.environ.get("RELEASE_PATHS", "")
          if not (token and api and repo and tag):
              print("Release skipped: missing API context or tag.")
              raise SystemExit(0)

          files = []
          seen = set()
          for pat in raw_paths.splitlines():
              pat = pat.strip()
              if not pat:
                  continue
              for match in sorted(glob.glob(pat)):
                  if os.path.isfile(match) and match not in seen:
                      seen.add(match)
                      files.append(match)

          if not files:
              print(f"Release skipped for tag {tag}: no matching artifact files found.")
              raise SystemExit(0)

          def api_json(method, path, payload=None):
              url = f"{api}/repos/{repo}{path}"
              headers = {"Authorization": f"token {token}"}
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      return resp.status, (json.loads(body) if body.strip() else {})
              except urllib.error.HTTPError as exc:
                  err = exc.read().decode("utf-8", errors="replace")
                  return exc.code, {"error": err[:300]}
              except Exception as exc:
                  return 0, {"error": str(exc)}

          def upload_asset(rel_id, fpath):
              fname = os.path.basename(fpath)
              qname = urllib.parse.quote(fname)
              url = f"{api}/repos/{repo}/releases/{rel_id}/assets?name={qname}"
              boundary = f"----GiteaRel{uuid.uuid4().hex}"
              ctype = mimetypes.guess_type(fname)[0] or "application/octet-stream"
              with open(fpath, "rb") as fh:
                  content = fh.read()
              body = (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; name="attachment"; filename="{fname}"\r\n'
                  f"Content-Type: {ctype}\r\n\r\n"
              ).encode("utf-8") + content + f"\r\n--{boundary}--\r\n".encode("utf-8")
              headers = {
                  "Authorization": f"token {token}",
                  "Content-Type": f"multipart/form-data; boundary={boundary}",
              }
              req = urllib.request.Request(url, data=body, method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      return resp.status, resp.read().decode("utf-8", errors="replace")[:200]
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", errors="replace")[:200]
              except Exception as exc:
                  return 0, str(exc)

          qtag = urllib.parse.quote(tag, safe="")
          st, rel = api_json("GET", f"/releases/tags/{qtag}")
          if st == 404:
              st, rel = api_json(
                  "POST",
                  "/releases",
                  {
                      "tag_name": tag,
                      "name": tag,
                      "body": f"Automated release artifacts published by Gitea Actions for tag `{tag}`.",
                      "draft": False,
                      "prerelease": ("-" in tag),
                  },
              )
          if st not in (200, 201) or not isinstance(rel, dict) or not rel.get("id"):
              print(f"Release creation/lookup failed for {tag} -> HTTP {st}: {rel}")
              if st == 403:
                  print("Hint: set GITEA_RELEASE_TOKEN secret if token lacks release write scope")
              raise SystemExit(0)

          rel_id = rel["id"]
          st_a, assets = api_json("GET", f"/releases/{rel_id}/assets")
          existing = {}
          if st_a == 200 and isinstance(assets, list):
              for a in assets:
                  if isinstance(a, dict) and a.get("name") and a.get("id"):
                      existing[a["name"]] = a["id"]

          for fpath in files:
              fname = os.path.basename(fpath)
              if fname in existing:
                  da, _ = api_json("DELETE", f"/releases/{rel_id}/assets/{existing[fname]}")
                  print(f"[release {tag}] Replaced existing asset {fname} -> HTTP {da}")
              su, msg = upload_asset(rel_id, fpath)
              fsize = os.path.getsize(fpath)
              print(f"[release {tag}] Uploaded {fname} ({fsize} bytes) -> HTTP {su}")
              if su not in (200, 201):
                  print(f"  detail: {msg}")
          PY

      - name: "Retention: Prune Older Workflow Runs, Logs & Artifacts (Keep Last 3, Max 7 Days)"
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_CLEANUP_TOKEN || gitea.token }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPO: ${{ gitea.repository }}
          GITEA_RUN_ID: ${{ gitea.run_id }}
          KEEP_RUNS: "3"
          RETENTION_DAYS: "7"
        run: |
          if [ -z "${GITEA_TOKEN:-}" ] || ! command -v python3 >/dev/null 2>&1; then
            echo "Retention skipped: missing GITEA_TOKEN or python3."
            exit 0
          fi
          python3 - <<'PY'
          import collections, datetime, json, os, re, urllib.error, urllib.request

          token = os.environ.get("GITEA_TOKEN", "").strip()
          api = os.environ.get("GITEA_API_URL", "").rstrip("/")
          repo = os.environ.get("GITEA_REPO", "").strip("/")
          cur_id = str(os.environ.get("GITEA_RUN_ID", "")).strip()
          keep = int(os.environ.get("KEEP_RUNS", "3"))
          retention_days = int(os.environ.get("RETENTION_DAYS", "7"))
          if not (token and api and repo):
              print("Retention skipped: missing API context.")
              raise SystemExit(0)

          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(
              days=retention_days
          )

          def parse_ts(val):
              if not val or not isinstance(val, str):
                  return None
              s = val.strip()
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              s = re.sub(r"(\.\d{6})\d+", r"\1", s)
              try:
                  dt = datetime.datetime.fromisoformat(s)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=datetime.timezone.utc)
                  return dt.astimezone(datetime.timezone.utc)
              except Exception:
                  return None

          def is_expired(obj):
              for key in ("created_at", "started_at", "updated_at", "completed_at"):
                  dt = parse_ts(obj.get(key))
                  if dt is not None:
                      return dt < cutoff
              return False

          def req(method, path):
              url = f"{api}/repos/{repo}{path}"
              r = urllib.request.Request(
                  url, method=method, headers={"Authorization": f"token {token}"}
              )
              try:
                  with urllib.request.urlopen(r, timeout=15) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      return resp.status, (json.loads(body) if body.strip() else {})
              except urllib.error.HTTPError as exc:
                  err = exc.read().decode("utf-8", errors="replace")
                  return exc.code, {"error": err[:200]}
              except Exception as exc:
                  return 0, {"error": str(exc)}

          all_runs = []
          for page in range(1, 21):
              st, data = req("GET", f"/actions/runs?page={page}&limit=50")
              if st != 200:
                  print(f"GET runs page={page} -> HTTP {st}: {data}")
                  break
              batch = (data.get("workflow_runs") or []) if isinstance(data, dict) else []
              if not batch:
                  break
              all_runs.extend(batch)
              if len(batch) < 50:
                  break

          by_wf = collections.defaultdict(list)
          for run in all_runs:
              wf = (run.get("path") or "__unknown__").split("@", 1)[0]
              by_wf[wf].append(run)

          active_states = {"in_progress", "running", "queued", "waiting", "pending"}
          pruned_ids = set()
          for wf, runs in sorted(by_wf.items()):
              runs.sort(key=lambda r: int(r.get("id") or 0), reverse=True)
              for idx, run in enumerate(runs):
                  if idx < keep and not is_expired(run):
                      continue
                  rid = str(run.get("id") or "")
                  status = str(run.get("status") or "").lower()
                  if not rid or rid == cur_id or status in active_states:
                      continue
                  pruned_ids.add(rid)
                  st_a, arts = req("GET", f"/actions/runs/{rid}/artifacts")
                  if st_a == 200 and isinstance(arts, dict):
                      for art in (arts.get("artifacts") or []):
                          aid = art.get("id")
                          if aid is not None:
                              da, _ = req("DELETE", f"/actions/artifacts/{aid}")
                              print(f"[{wf}] DEL artifact id={aid} -> HTTP {da}")
                  dr, _ = req("DELETE", f"/actions/runs/{rid}")
                  print(f"[{wf}] DEL run id={rid} (logs+run) -> HTTP {dr}")
                  if dr == 403:
                      print("Hint: set GITEA_CLEANUP_TOKEN secret if token lacks delete")

          st_all, repo_arts = req("GET", "/actions/artifacts?limit=100")
          if st_all == 200 and isinstance(repo_arts, dict):
              for art in (repo_arts.get("artifacts") or []):
                  wrid = str((art.get("workflow_run") or {}).get("id") or "")
                  if wrid in pruned_ids or art.get("expired") or is_expired(art):
                      aid = art.get("id")
                      if aid is not None:
                          da, _ = req("DELETE", f"/actions/artifacts/{aid}")
                          print(f"[orphan/expired] DEL artifact {aid} -> HTTP {da}")
          print(
              f"Retention check finished (keep={keep}, "
              f"retention_days={retention_days}, runs_scanned={len(all_runs)})"
          )
