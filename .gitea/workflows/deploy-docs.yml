name: Build & Publish Documentation (Gitea)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Documentation Site & PDF Manual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout MkDocs Kit
        uses: actions/checkout@v4
        with:
          repository: m/mkdocs-kit
          github-server-url: ${{ gitea.server_url }}
          path: mkdocs-kit
          token: ${{ gitea.token }}

      - name: Install System Dependencies
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends plantuml graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 default-jre-headless

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install mkdocs mkdocs-material weasyprint wireviz nwdiag bit_field

      - name: Build Documentation
        env:
          MKDOCS_KIT_BIN: ${{ gitea.workspace }}/mkdocs-kit/mkdocs-kit
        run: |
          chmod +x ./helpers/build-docs.sh
          ./helpers/build-docs.sh build --refresh

      - name: Upload Documentation Site Artifact
        uses: actions/upload-artifact@v3
        with:
          name: quasar-docs-site
          path: doc/site/

      - name: Upload PDF Manual Artifact
        uses: actions/upload-artifact@v3
        with:
          name: quasar-docs-pdf
          path: doc/documentation.pdf
