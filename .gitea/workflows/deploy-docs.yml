name: Build & Publish Documentation (Gitea)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Documentation Site & PDF Manual
    runs-on: ubuntu-latest
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')

    steps:
      - name: Checkout Repository
        shell: bash
        env:
          GITEA_TOKEN: ${{ gitea.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://gitea2.lecabellec.fr/${{ gitea.repository }}.git"
          if [ -n "${GITEA_TOKEN:-}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://gitea2.lecabellec.fr/.extraheader=Authorization: Basic ${AUTH_B64}" \
              fetch --no-tags --prune --depth=1 origin "${{ gitea.ref }}"
          else
            git fetch --no-tags --prune --depth=1 origin "${{ gitea.ref }}"
          fi
          git checkout --force "${{ gitea.sha }}" 2>/dev/null || git checkout --force FETCH_HEAD

      - name: Checkout MkDocs Kit
        shell: bash
        env:
          GITEA_TOKEN: ${{ gitea.token }}
        run: |
          rm -rf mkdocs-kit
          if [ -n "${GITEA_TOKEN:-}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://gitea2.lecabellec.fr/.extraheader=Authorization: Basic ${AUTH_B64}" \
              clone --depth=1 "https://gitea2.lecabellec.fr/m/mkdocs-kit.git" mkdocs-kit
          else
            git clone --depth=1 "https://gitea2.lecabellec.fr/m/mkdocs-kit.git" mkdocs-kit
          fi

      - name: Install System Dependencies
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends plantuml graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libjpeg-dev libopenjp2-7-dev libffi-dev libxml2-dev libxslt1-dev default-jre-headless

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install ./mkdocs-kit

      - name: Build Documentation
        run: |
          cd doc
          mkdocs-kit build

      - name: Upload Documentation Site Artifact
        uses: actions/upload-artifact@v3
        with:
          name: quasar-docs-site
          path: doc/site/

      - name: Upload PDF Manual Artifact
        uses: actions/upload-artifact@v3
        with:
          name: quasar-docs-pdf
          path: doc/documentation.pdf
