name: Gitea CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian-12
            optional: false
          - os: debian-13
            optional: true
          - os: fedora
            optional: true
          - os: archlinux
            optional: true

    steps:
      - name: Install Node.js and Git Prerequisites (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: apt-get update && apt-get install -y --no-install-recommends nodejs git ca-certificates

      - name: Install Node.js and Git Prerequisites (Arch Linux)
        if: matrix.os == 'archlinux'
        run: pacman -Sy --noconfirm nodejs git ca-certificates

      - name: Install Node.js and Git Prerequisites (Fedora)
        if: matrix.os == 'fedora'
        run: dnf install -y nodejs git ca-certificates

      - name: Install dependencies (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ccache cmake g++ make pkg-config python3 file linux-headers-amd64 \
                              libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
                              libgmp-dev libssl-dev libsasl2-dev libzstd-dev uuid-dev binutils-dev libbfd-dev zlib1g-dev libiberty-dev libcurl4-openssl-dev gdb \
                              curl npm python3-pip python3-venv plantuml default-jre graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 autoconf automake libtool

      - name: Install dependencies (Fedora)
        if: matrix.os == 'fedora'
        run: |
          dnf install -y gcc-c++ make cmake pkgconf-pkg-config python3 file \
                         kernel-devel autoconf automake libtool dkms \
                         alsa-lib-devel libX11-devel libXrandr-devel libXi-devel \
                         mesa-libGL-devel mesa-libGLU-devel libXcursor-devel libXinerama-devel \
                         gmp-devel openssl-devel libuuid-devel zlib-devel binutils-devel \
                         yaml-cpp-devel tinyxml2-devel ccache gdb libzstd-devel \
                         curl npm python3-pip plantuml java-21-openjdk pango cairo

      - name: Install dependencies (Arch Linux)
        if: matrix.os == 'archlinux'
        run: |
          pacman -S --needed --noconfirm \
                         base-devel cmake python file \
                         linux-headers autoconf automake libtool dkms \
                         alsa-lib libx11 libxrandr libxi mesa glu libxcursor libxinerama \
                         gmp openssl util-linux-libs zlib binutils yaml-cpp tinyxml2 ccache gdb \
                         curl npm python-pip plantuml jre-openjdk pango cairo

      - name: Checkout Quasar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ matrix.os }}-ccache-${{ gitea.sha }}
          restore-keys: |
            ${{ matrix.os }}-ccache-

      - name: Configure CMake Projects
        run: |
          mkdir -p .ccache
          cmake -S cmake-projects -B build-projects \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_POLICY_DEFAULT_CMP0000=NEW \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_SHARED_LINKER_FLAGS="-lzstd" \
                -DCMAKE_EXE_LINKER_FLAGS="-lzstd"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: Build CMake Projects
        run: |
          ccache -z
          cmake --build build-projects --parallel $(nproc)
          ccache -s
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: Test CMake Projects
        run: ctest --test-dir build-projects --output-on-failure --repeat until-pass:99 -E "GoogleTestVerification|VerifyPermissionSkippingOnStart"

      - name: Run Stress Tests in GDB
        continue-on-error: true
        run: gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"

      - name: Package (Debian/RPM/TGZ)
        run: |
          cd build-projects
          if command -v dpkg > /dev/null; then
            cpack -G DEB
          elif command -v rpmbuild > /dev/null; then
            cpack -G RPM
          else
            cpack -G TGZ
          fi

      - name: Build Documentation
        continue-on-error: true
        run: |
          chmod +x ./helpers/build-docs.sh
          ./helpers/build-docs.sh build --refresh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: quasar-pkg-${{ matrix.os }}
          path: |
            build-projects/*.deb
            build-projects/*.rpm
            build-projects/*.tar.gz
            doc/site/
            doc/documentation.pdf

      - name: Configure Linux Modules (EtherCAT)
        continue-on-error: true
        run: cmake -S linux-modules -B build-modules
