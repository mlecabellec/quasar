name: Gitea CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  CMAKE_VERBOSE_MAKEFILE: "ON"
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  runner-diagnostics:
    name: Pre-Matrix Runner & Container Discovery
    runs-on: ubuntu-latest
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')
    outputs:
      runner_name: ${{ steps.discover-containers.outputs.runner_name }}
      container_engine: ${{ steps.discover-containers.outputs.container_engine }}
      available_images: ${{ steps.discover-containers.outputs.available_images }}
      available_labels: ${{ steps.discover-containers.outputs.available_labels }}

    steps:
      - name: "Debug: Full Gitea, Runner, Strategy, Matrix & Env Contexts"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_VARS: ${{ toJSON(vars) }}
          CTX_INPUTS: ${{ toJSON(inputs) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-runner-diagnostics"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 01] Debug: Full Gitea, Runner, Strategy, Matrix & Env Contexts ==="
            echo "=== UTC Timestamp ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "=== Runner Context ==="
            printf '%s\n' "$CTX_RUNNER"
            echo "=== Job Context ==="
            printf '%s\n' "$CTX_JOB"
            echo "=== Strategy / Matrix Context ==="
            printf '%s\n' "$CTX_STRATEGY"
            printf '%s\n' "$CTX_MATRIX"
            echo "=== Vars / Inputs Context ==="
            printf '%s\n' "$CTX_VARS"
            printf '%s\n' "$CTX_INPUTS"
            echo "=== Gitea Context (token redacted) ==="
            printf '%s\n' "$CTX_GITEA" | sed -E 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'
            echo "=== Environment Variables (single-line sorted, sensitive values redacted) ==="
            python3 - <<'PY'
          import os, re
          pat = re.compile(r'(TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)', re.I)
          for k in sorted(os.environ):
              if k.startswith("CTX_"):
                  continue
              v = "***" if pat.search(k) else os.environ[k].replace("\n", "\\n")
              print(f"{k}={v}")
          PY
            if ! command -v node >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
              SUDO=""
              [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
              $SUDO apt-get update
              $SUDO apt-get install -y --no-install-recommends nodejs git ca-certificates
            fi
          ) 2>&1 | tee -a "$LOG_DIR/01-debug-contexts.log" "$LOG_DIR/quasar-runner-diagnostics-full-execution.log"
          cp -f "$LOG_DIR/01-debug-contexts.log" "$LOG_DIR/quasar-runner-diagnostics-01-first-analysis.log"

      - name: Push First Analysis Step Logs
        id: push-first-analysis-logs
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            /tmp/quasar-ci-logs-runner-diagnostics/quasar-runner-diagnostics-01-first-analysis.log

      - name: "Debug: Host OS, Kernel, Hardware, Cgroups & Network"
        run: |
          set -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-runner-diagnostics"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 02] Push First Analysis Step Logs Action Status ==="
            echo "outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
          } | tee -a "$LOG_DIR/02-action-push-first-analysis-logs.log" "$LOG_DIR/quasar-runner-diagnostics-full-execution.log"
          (
            set +e
            set -x
            echo "=== [STEP 03] Debug: Host OS, Kernel, Hardware, Cgroups & Network ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            cat /etc/os-release 2>/dev/null || true
            uname -a
            hostname -f 2>/dev/null || hostname || true
            id
            pwd
            uptime || true
            nproc || true
            lscpu 2>/dev/null | head -n 30 || true
            free -h || true
            df -hT || true
            ls -la / /.dockerenv /run/.containerenv 2>/dev/null || true
            cat /run/.containerenv 2>/dev/null || true
            cat /proc/1/cgroup 2>/dev/null || true
            grep -E 'overlay|fuse|cgroup|docker|podman|/var/run/act|/opt/hostedtoolcache' /proc/self/mountinfo 2>/dev/null || true
            cat /etc/resolv.conf 2>/dev/null || true
            cat /etc/hosts 2>/dev/null || true
            ip addr 2>/dev/null || hostname -I 2>/dev/null || true
            ip route 2>/dev/null || cat /proc/net/route 2>/dev/null || true
            getent hosts gitea2.lecabellec.fr github.com registry-1.docker.io 2>/dev/null || true
            ls -la /opt/hostedtoolcache /opt/acttoolcache /var/run/act /root/.cache/act 2>/dev/null || true
            find /opt/hostedtoolcache /opt/acttoolcache -maxdepth 3 2>/dev/null || true
            for cmd in docker podman crictl buildah skopeo curl wget python3 jq git node npm cmake gcc g++ make ccache gdb plantuml java mvn; do
              if command -v "$cmd" >/dev/null 2>&1; then
                printf "%-12s %s\n" "$cmd:" "$(command -v "$cmd")"
              else
                printf "%-12s missing\n" "$cmd:"
              fi
            done
          ) 2>&1 | tee -a "$LOG_DIR/03-debug-host-os.log" "$LOG_DIR/quasar-runner-diagnostics-full-execution.log"

      - name: "Debug: Container Socket & Daemon Introspection (Images, Containers, Labels)"
        id: discover-containers
        run: |
          set -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-runner-diagnostics"
          mkdir -p "$LOG_DIR"
          (
            set +e
            echo "=== [STEP 04] Debug: Container Socket & Daemon Introspection ==="
            echo "=== Candidate Container Sockets ==="
            ls -la /var/run/docker.sock /run/podman/podman.sock /run/docker.sock /run/user/*/podman/podman.sock 2>/dev/null || true
            echo "DOCKER_HOST=${DOCKER_HOST:-unset} CONTAINER_HOST=${CONTAINER_HOST:-unset}"

            if command -v docker >/dev/null 2>&1; then
              echo "=== docker version ==="
              docker version 2>&1 || true
              echo "=== docker info ==="
              docker info 2>&1 || true
              echo "=== docker images -a ==="
              docker images --all --digests 2>&1 || true
              echo "=== docker ps -a ==="
              docker ps -a --no-trunc 2>&1 || true
              echo "=== docker network ls / volume ls ==="
              docker network ls 2>&1 || true
              docker volume ls 2>&1 || true
            fi

            if command -v podman >/dev/null 2>&1; then
              echo "=== podman info / images / ps ==="
              podman --version 2>&1 || true
              podman info 2>&1 || true
              podman images --all --digests 2>&1 || true
              podman ps -a 2>&1 || true
            fi

            if command -v python3 >/dev/null 2>&1; then
              python3 - <<'PY'
          import json
          import os
          import socket

          candidate_sockets = [
              "/var/run/docker.sock",
              "/run/podman/podman.sock",
              "/run/docker.sock",
          ]
          present_sockets = [s for s in candidate_sockets if os.path.exists(s)]
          print("=== Python Unix Socket API Introspection ===")
          print("Present sockets:", present_sockets)

          def api_get(sock_path: str, endpoint: str) -> tuple[int, str]:
              client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              client.settimeout(5.0)
              client.connect(sock_path)
              req = f"GET {endpoint} HTTP/1.0\r\nHost: localhost\r\n\r\n"
              client.sendall(req.encode("utf-8"))
              chunks = []
              while True:
                  data = client.recv(65536)
                  if not data:
                      break
                  chunks.append(data)
              client.close()
              raw = b"".join(chunks).decode("utf-8", errors="replace")
              header, _, body = raw.partition("\r\n\r\n")
              status_line = header.splitlines()[0] if header else ""
              parts = status_line.split()
              status = int(parts[1]) if len(parts) >= 2 and parts[1].isdigit() else 0
              return status, body

          expected_label_images = {
              "ubuntu-latest": ["ubuntu", "act-latest", "runner"],
              "debian-12": ["debian:12", "debian:bookworm"],
              "debian-13": ["debian:13", "debian:trixie"],
              "fedora": ["fedora"],
              "archlinux": ["archlinux"],
          }

          image_tags = []
          engine_summary = "none"
          matched_labels = []

          for sock in present_sockets:
              print(f"\n--- Querying {sock} ---")
              try:
                  st, ver_raw = api_get(sock, "/version")
                  print(f"GET /version ({st}): {ver_raw.strip()}")
                  if st == 200:
                      v = json.loads(ver_raw)
                      engine_summary = f"{v.get('Platform', {}).get('Name', 'container-engine')} {v.get('Version', '')}".strip()
              except Exception as e:
                  print(f"/version error: {e}")

              try:
                  st, info_raw = api_get(sock, "/info")
                  if st == 200:
                      info = json.loads(info_raw)
                      subset = {
                          k: info.get(k)
                          for k in (
                              "ID", "Name", "ServerVersion", "Driver", "CgroupDriver",
                              "CgroupVersion", "OperatingSystem", "OSType", "Architecture",
                              "NCPU", "MemTotal", "Containers", "ContainersRunning",
                              "ContainersPaused", "ContainersStopped", "Images", "SecurityOptions",
                          )
                          if k in info
                      }
                      print(f"GET /info ({st}) summary:\n{json.dumps(subset, indent=2)}")
              except Exception as e:
                  print(f"/info error: {e}")

              try:
                  st, imgs_raw = api_get(sock, "/images/json?all=1")
                  imgs = json.loads(imgs_raw) if st == 200 else []
                  print(f"GET /images/json ({st}) -> {len(imgs)} images:")
                  for img in imgs:
                      tags = img.get("RepoTags") or []
                      digests = img.get("RepoDigests") or []
                      size_mb = round((img.get("Size") or 0) / (1024 * 1024), 1)
                      print(f"  - id={str(img.get('Id', ''))[:19]} size={size_mb}MB tags={tags} digests={digests}")
                      for t in tags:
                          if t and t != "<none>:<none>" and t not in image_tags:
                              image_tags.append(t)
              except Exception as e:
                  print(f"/images/json error: {e}")

              try:
                  st, ctrs_raw = api_get(sock, "/containers/json?all=1")
                  ctrs = json.loads(ctrs_raw) if st == 200 else []
                  print(f"GET /containers/json ({st}) -> {len(ctrs)} containers:")
                  for c in ctrs:
                      names = c.get("Names")
                      image = c.get("Image")
                      state = c.get("State")
                      status = c.get("Status")
                      net = (c.get("HostConfig") or {}).get("NetworkMode")
                      mounts = [f"{m.get('Type')}:{m.get('Source')}->{m.get('Destination')}" for m in (c.get("Mounts") or [])]
                      print(f"  - names={names} image={image} state={state} ({status}) net={net} mounts={mounts}")
              except Exception as e:
                  print(f"/containers/json error: {e}")

              try:
                  st, nets_raw = api_get(sock, "/networks")
                  nets = json.loads(nets_raw) if st == 200 else []
                  print(f"GET /networks ({st}): {[{'name': n.get('Name'), 'driver': n.get('Driver'), 'scope': n.get('Scope')} for n in nets]}")
              except Exception as e:
                  print(f"/networks error: {e}")

              try:
                  st, vols_raw = api_get(sock, "/volumes")
                  vols = json.loads(vols_raw) if st == 200 else {}
                  vol_list = vols.get("Volumes") or []
                  print(f"GET /volumes ({st}) -> {len(vol_list)} volumes: {[v.get('Name') for v in vol_list]}")
              except Exception as e:
                  print(f"/volumes error: {e}")

          print("\n=== Matrix Label <-> Discovered Image Match Report ===")
          for label, refs in expected_label_images.items():
              found = [r for r in refs if any(r in t or t.endswith(r) for t in image_tags)]
              status = f"CACHED ({found})" if found else "NOT CACHED LOCALLY (pull needed on job start)"
              print(f"  {label:14s} -> {status}")
              if found:
                  matched_labels.append(label)

          container_runtime = os.environ.get("container", "")
          if container_runtime == "podman" and not image_tags:
              print(
                  "\n[NOTE] Container runtime is 'podman' (mountinfo shows /var/lib/containers/storage), "
                  "while /var/run/docker.sock belongs to Docker Engine with 0 images. "
                  "Host Podman images are managed outside this Docker socket."
              )
              engine_summary = f"podman (host); mounted socket={engine_summary} [0 images]"

          runner_name = (
              os.environ.get("RUNNER_NAME")
              or f"{socket.gethostname()} (act_runner {os.environ.get('GITEA_ACTIONS_RUNNER_VERSION', 'unknown')}, container={container_runtime or 'docker'})"
          )
          out_path = os.environ.get("GITHUB_OUTPUT") or os.environ.get("GITEA_OUTPUT")
          if out_path:
              with open(out_path, "a", encoding="utf-8") as fh:
                  fh.write(f"runner_name={runner_name}\n")
                  fh.write(f"container_engine={engine_summary}\n")
                  fh.write(f"available_images={json.dumps(image_tags)}\n")
                  fh.write(f"available_labels={json.dumps(matched_labels)}\n")
              print(f"Wrote discovery outputs to {out_path}")
          PY
            fi
          ) 2>&1 | tee -a "$LOG_DIR/04-debug-container-socket.log" "$LOG_DIR/quasar-runner-diagnostics-full-execution.log"

      - name: "Debug: Probe Gitea Instance API & External Connectivity"
        env:
          GITEA_TOKEN: ${{ gitea.token }}
        run: |
          set -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-runner-diagnostics"
          mkdir -p "$LOG_DIR"
          (
            set +e
            echo "=== [STEP 05] Debug: Probe Gitea Instance API & External Connectivity ==="
            if command -v curl >/dev/null 2>&1; then
              echo "=== Gitea API /version ==="
              curl -sS -m 5 -H "Authorization: token ${GITEA_TOKEN}" "${{ gitea.api_url }}/version" || true
              echo ""
              echo "=== Gitea API Current Workflow Run & Jobs ==="
              curl -sS -m 5 -H "Authorization: token ${GITEA_TOKEN}" "${{ gitea.api_url }}/repos/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}" | head -c 2000 || true
              echo ""
              curl -sS -m 5 -H "Authorization: token ${GITEA_TOKEN}" "${{ gitea.api_url }}/repos/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}/jobs" | head -c 4000 || true
              echo ""
              echo "=== Gitea API Repo Runners ==="
              curl -sS -m 5 -H "Authorization: token ${GITEA_TOKEN}" "${{ gitea.api_url }}/repos/${{ gitea.repository }}/actions/runners" | head -c 2000 || true
              echo ""
              echo "=== GitHub HTTPS Probe ==="
              curl -sSI -m 5 https://github.com | head -n 5 || true
            fi
          ) 2>&1 | tee -a "$LOG_DIR/05-debug-gitea-api.log" "$LOG_DIR/quasar-runner-diagnostics-full-execution.log"

      - name: "Diagnostic: Pre-Matrix Discovery Summary"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-runner-diagnostics"
          mkdir -p "$LOG_DIR" ci-logs
          (
            echo "=== [STEP 06] Diagnostic: Pre-Matrix Discovery Summary ==="
            echo "Discovery Job Status: ${{ job.status }}"
            echo "Runner Name / Host:   ${{ steps.discover-containers.outputs.runner_name }}"
            echo "Container Engine:     ${{ steps.discover-containers.outputs.container_engine }}"
            echo "Available Images:     ${{ steps.discover-containers.outputs.available_images }}"
            echo "Cached Matrix Labels: ${{ steps.discover-containers.outputs.available_labels }}"
            echo "push-first-analysis-logs: outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
          ) 2>&1 | tee -a "$LOG_DIR/06-diagnostic-discovery-summary.log" "$LOG_DIR/quasar-runner-diagnostics-full-execution.log"
          cp -f "$LOG_DIR"/*.log ci-logs/ 2>/dev/null || true
          tar -czf ci-logs/quasar-runner-diagnostics-full-logs.tar.gz -C "$LOG_DIR" .
          ls -lh ci-logs/

      - name: Push Full Execution Logs
        id: push-full-execution-logs
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            ci-logs/quasar-runner-diagnostics-full-execution.log
            ci-logs/quasar-runner-diagnostics-full-logs.tar.gz

  build-ubuntu:
    name: Build, Test & Package (ubuntu-latest)
    needs: runner-diagnostics
    runs-on: ubuntu-latest
    if: always() && startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')

    steps:
      - name: "Diagnostic: Environment, Pre-Matrix & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_NEEDS: ${{ toJSON(needs) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 01] Diagnostic: Environment, Pre-Matrix & Runner Context (ubuntu-latest) ==="
            echo "=== UTC Timestamp ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "=== Host / Container OS & Hardware ==="
            cat /etc/os-release 2>/dev/null || true
            uname -a
            hostname -f 2>/dev/null || hostname || true
            id
            pwd
            nproc || true
            free -h || true
            df -hT . || true
            cat /run/.containerenv 2>/dev/null || ls -la /.dockerenv 2>/dev/null || true
            cat /proc/1/cgroup 2>/dev/null || true
            cat /etc/resolv.conf 2>/dev/null || true
            echo "=== Pre-Matrix Discovery Outputs (needs) ==="
            printf '%s\n' "$CTX_NEEDS"
            echo "=== Runner & Job Context ==="
            printf '%s\n' "$CTX_RUNNER"
            printf '%s\n' "$CTX_JOB"
            echo "=== Strategy / Matrix Context ==="
            printf '%s\n' "$CTX_STRATEGY"
            printf '%s\n' "$CTX_MATRIX"
            echo "=== Gitea Context (token redacted) ==="
            printf '%s\n' "$CTX_GITEA" | sed -E 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'
            echo "=== Environment Variables (redacted) ==="
            unset CTX_RUNNER CTX_JOB CTX_NEEDS CTX_STRATEGY CTX_MATRIX CTX_GITEA
            env | sort | sed -E 's/^([^=]*(TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)[^=]*)=.*/\1=***/I'
            if ! command -v node >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
              echo "=== Bootstrapping Node.js and Git for gitea-release-action ==="
              SUDO=""
              [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
              $SUDO apt-get update
              $SUDO apt-get install -y --no-install-recommends git ca-certificates nodejs
            fi
          ) 2>&1 | tee -a "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
          cp -f "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-ubuntu-latest-01-first-analysis.log"

      - name: Push First Analysis Step Logs
        id: push-first-analysis-logs
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            /tmp/quasar-ci-logs-ubuntu-latest/quasar-ubuntu-latest-01-first-analysis.log

      - name: Install Node.js and Git Prerequisites (Ubuntu)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 02] Push First Analysis Step Logs Action Status ==="
            echo "outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
          } | tee -a "$LOG_DIR/02-action-push-first-analysis-logs.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 03] Install Node.js and Git Prerequisites (Ubuntu) ==="
            SUDO=""
            [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends git ca-certificates
            command -v node >/dev/null 2>&1 || $SUDO apt-get install -y --no-install-recommends nodejs
            node --version
            git --version
          ) 2>&1 | tee -a "$LOG_DIR/03-install-prerequisites.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
          rm -rf ci-logs

      - name: Checkout Quasar
        id: checkout-quasar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Diagnostic: Post-Checkout Git & Submodule State"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 04] Checkout Quasar Action Status ==="
            echo "outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
          } | tee -a "$LOG_DIR/04-action-checkout-quasar.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 05] Diagnostic: Post-Checkout Git & Submodule State ==="
            ls -la
            git status -sb || true
            git branch -a || true
            git remote -v || true
            git log -n 5 --oneline --decorate || true
            git submodule status --recursive || true
            ls -la cmake-projects doc linux-modules 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/05-diagnostic-post-checkout.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Install dependencies (Ubuntu)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 06] Install dependencies (Ubuntu) ==="
            SUDO=""
            [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends build-essential ccache cmake g++ make pkg-config python3 file \
                                      libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
                                      libgmp-dev libssl-dev libsasl2-dev libzstd-dev uuid-dev binutils-dev libbfd-dev zlib1g-dev libiberty-dev libcurl4-openssl-dev gdb \
                                      curl python3-pip python3-venv plantuml default-jre graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 autoconf automake libtool
          ) 2>&1 | tee -a "$LOG_DIR/06-install-dependencies.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: "Diagnostic: Workspace, Toolchain, Compilers & Libraries Check"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 07] Diagnostic: Workspace, Toolchain, Compilers & Libraries Check ==="
            echo "=== Workspace Files ==="
            ls -la
            echo "=== Available Tools & Versions ==="
            for cmd in node npm git python3 pip3 cmake ctest cpack ccache gcc g++ ld make gdb pkg-config plantuml dot java dpkg dpkg-deb mvn podman docker curl; do
              if command -v "$cmd" >/dev/null 2>&1; then
                printf "%-12s %s\n" "$cmd:" "$(command -v "$cmd")"
              else
                printf "%-12s missing\n" "$cmd:"
              fi
            done
            cmake --version || true
            gcc --version | head -n 1 || true
            g++ --version | head -n 1 || true
            python3 --version || true
            node --version || true
            java -version 2>&1 || true
            ccache --version | head -n 1 || true
            gdb --version | head -n 1 || true
            echo "=== pkg-config Libraries (subset) ==="
            pkg-config --list-all 2>/dev/null | grep -iE 'alsa|x11|gl|ssl|zstd|uuid|curl|yaml|tinyxml|zlib|pango' | sort || true
          ) 2>&1 | tee -a "$LOG_DIR/07-diagnostic-toolchain.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Restore ccache
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ubuntu-latest-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          restore-keys: |
            ubuntu-latest-ccache-${{ gitea.sha }}-
            ubuntu-latest-ccache-

      - name: "Diagnostic: Pre-Configure ccache & CMake Environment"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 08] Restore ccache Action Status ==="
            echo "outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
          } | tee -a "$LOG_DIR/08-action-restore-ccache.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 09] Diagnostic: Pre-Configure ccache & CMake Environment ==="
            mkdir -p .ccache
            ccache -s || true
          ) 2>&1 | tee -a "$LOG_DIR/09-diagnostic-pre-configure.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: Configure CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 10] Configure CMake Projects ==="
            mkdir -p build-projects
            cmake -S cmake-projects -B build-projects \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/10-configure-cmake.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Post-Configure CMake Cache & Discovered Tests"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 11] Diagnostic: Post-Configure CMake Cache & Discovered Tests ==="
            ls -la build-projects
            grep -E '^(CMAKE_BUILD_TYPE|CMAKE_CXX_COMPILER|CMAKE_C_COMPILER|CMAKE_CXX_FLAGS|BUILD_TESTING):' build-projects/CMakeCache.txt 2>/dev/null || true
            ctest --test-dir build-projects -N || true
          ) 2>&1 | tee -a "$LOG_DIR/11-diagnostic-post-configure.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Build CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 12] Build CMake Projects ==="
            ccache -z
            CPUS=$(nproc 2>/dev/null || echo 2)
            MEM_AVAIL_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)
            # Reserve ~4 GiB per concurrent C++23 -O3 compilation slot (0B swap on runner), capped at 2
            MEM_JOBS=$(( MEM_AVAIL_KB / 4194304 ))
            if [ "$MEM_JOBS" -lt 1 ]; then MEM_JOBS=1; fi
            BUILD_JOBS=$(( CPUS < MEM_JOBS ? CPUS : MEM_JOBS ))
            if [ "$BUILD_JOBS" -gt 2 ]; then BUILD_JOBS=2; fi
            echo "Build parallelism: BUILD_JOBS=$BUILD_JOBS (nproc=$CPUS, MemAvailable=${MEM_AVAIL_KB}kB)"
            free -h || true
            cmake --build build-projects --target liblua quasar_coretypes quasar_named utils --parallel "$BUILD_JOBS" --verbose
            # Build sol2-heavy quasar_scripting sequentially so RegistryBindings.cpp has full RAM headroom
            cmake --build build-projects --target quasar_scripting --parallel 1 --verbose
            cmake --build build-projects --parallel "$BUILD_JOBS" --verbose
            free -h || true
            ccache -s
          ) 2>&1 | tee -a "$LOG_DIR/12-build-cmake.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Build Outputs & Binaries Inspection"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 13] Diagnostic: Build Outputs & Binaries Inspection ==="
            ls -la build-projects
            ls -la build-projects/bin 2>/dev/null || true
            ls -la build-projects/lib 2>/dev/null || true
            du -sh build-projects .ccache 2>/dev/null || true
            if [ -x ./build-projects/bin/scripting_test ]; then
              file ./build-projects/bin/scripting_test || true
              ldd ./build-projects/bin/scripting_test || true
            fi
          ) 2>&1 | tee -a "$LOG_DIR/13-diagnostic-build-outputs.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Test CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 14] Test CMake Projects ==="
            ctest --test-dir build-projects --verbose --output-on-failure --repeat until-pass:99 -E "GoogleTestVerification|VerifyPermissionSkippingOnStart"
          ) 2>&1 | tee -a "$LOG_DIR/14-test-cmake.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Run Stress Tests in GDB
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 15] Run Stress Tests in GDB ==="
            ls -lh ./build-projects/bin/scripting_test || true
            gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"
          ) 2>&1 | tee -a "$LOG_DIR/15-stress-tests-gdb.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Package (Debian/RPM/TGZ)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 16] Package (Debian/RPM/TGZ) ==="
            cd build-projects
            if command -v dpkg > /dev/null; then
              cpack -V -G DEB
            elif command -v rpmbuild > /dev/null; then
              cpack -V -G RPM
            else
              cpack -V -G TGZ
            fi
            ls -lh *.deb *.rpm *.tar.gz 2>/dev/null || true
            for pkg in *.deb; do [ -f "$pkg" ] && dpkg-deb -I "$pkg" || true; done
          ) 2>&1 | tee -a "$LOG_DIR/16-package-cpack.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Checkout MkDocs Kit
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 17] Checkout MkDocs Kit ==="
            rm -rf .cache/mkdocs-kit
            mkdir -p .cache
            git clone --depth=1 --verbose https://github.com/mlecabellec/mkdocs-kit.git .cache/mkdocs-kit
            git -C .cache/mkdocs-kit log -1 --oneline || true
          ) 2>&1 | tee -a "$LOG_DIR/17-checkout-mkdocs-kit.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Build Documentation
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 18] Build Documentation ==="
            python3 -m venv .venv-docs
            .venv-docs/bin/pip install -v --upgrade pip
            .venv-docs/bin/pip install -v "setuptools<82.0.0"
            .venv-docs/bin/pip install -v ./.cache/mkdocs-kit
            cd doc
            ls -la
            ../.venv-docs/bin/mkdocs-kit build -v
            cp -f mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log" 2>/dev/null || true
            tail -n 80 mkdocs-kit.log 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/18-build-documentation.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: "Diagnostic: Pre-Upload Artifacts Inventory"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR" release-assets
          (
            set -x
            echo "=== [STEP 19] Diagnostic: Pre-Upload Artifacts Inventory ==="
            ls -lh build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz doc/documentation.pdf doc/mkdocs-kit.log 2>/dev/null || true
            ls -la doc/site/ 2>/dev/null || true
            for pkg in build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz; do
              if [ -f "$pkg" ]; then
                cp -f "$pkg" "release-assets/quasar-pkg-ubuntu-latest-$(basename "$pkg")"
              fi
            done
            if [ -d doc/site ]; then
              tar -czf "release-assets/quasar-docs-site-ubuntu-latest.tar.gz" -C doc site
            fi
            if [ -f doc/documentation.pdf ]; then
              cp -f doc/documentation.pdf "release-assets/quasar-documentation-ubuntu-latest.pdf"
            fi
            if [ -f doc/mkdocs-kit.log ]; then
              cp -f doc/mkdocs-kit.log "release-assets/quasar-mkdocs-kit-ubuntu-latest.log"
              cp -f doc/mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log"
            fi
            ls -lh release-assets/ 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/19-pre-upload-inventory.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Upload Artifacts
        id: release-artifacts
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            release-assets/quasar-pkg-ubuntu-latest-*
            release-assets/quasar-docs-site-ubuntu-latest.tar.gz
            release-assets/quasar-documentation-ubuntu-latest.pdf
            release-assets/quasar-mkdocs-kit-ubuntu-latest.log

      - name: Configure Linux Modules (EtherCAT)
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 20] Upload Artifacts Action Status ==="
            echo "outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
          } | tee -a "$LOG_DIR/20-action-release-artifacts.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 21] Configure Linux Modules (EtherCAT) ==="
            cmake -S linux-modules -B build-modules --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/21-configure-linux-modules.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"

      - name: Save ccache
        id: ccache-save
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ubuntu-latest-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-ubuntu-latest"
          mkdir -p "$LOG_DIR" ci-logs
          for extra_log in \
            build-projects/CMakeFiles/CMakeConfigureLog.yaml \
            build-projects/Testing/Temporary/LastTest.log \
            build-projects/Testing/Temporary/LastTestsFailed.log \
            build-modules/CMakeFiles/CMakeConfigureLog.yaml \
            doc/mkdocs-kit.log; do
            if [ -f "$extra_log" ]; then
              cp -f "$extra_log" "$LOG_DIR/$(echo "$extra_log" | tr '/' '_')" 2>/dev/null || true
            fi
          done
          {
            echo "=== [STEP 22] Action Steps Status Summary (ubuntu-latest) ==="
            echo "push-first-analysis-logs: outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
            echo "checkout-quasar:          outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
            echo "ccache-restore:           outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
            echo "release-artifacts:        outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
            echo "ccache-save:              outcome=${{ steps.ccache-save.outcome }} conclusion=${{ steps.ccache-save.conclusion }}"
          } | tee -a "$LOG_DIR/22-action-steps-summary.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
          (
            echo "=== [STEP 23] Diagnostic: Post-Run Summary (ubuntu-latest) ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "Job Status: ${{ job.status }}"
            free -h || true
            df -h . || true
            du -sh * .cache .ccache .venv-docs build-* 2>/dev/null || true
            ccache -s 2>/dev/null || true
            ls -la
            ls -lh "$LOG_DIR" || true
          ) 2>&1 | tee -a "$LOG_DIR/23-post-run-summary.log" "$LOG_DIR/quasar-ubuntu-latest-full-execution.log"
          cp -f "$LOG_DIR/quasar-ubuntu-latest-full-execution.log" "ci-logs/quasar-ubuntu-latest-full-execution.log"
          tar -czf "ci-logs/quasar-ubuntu-latest-full-logs.tar.gz" -C "$LOG_DIR" .
          ls -lh ci-logs/

      - name: Push Full Execution Logs
        id: push-full-execution-logs
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            ci-logs/quasar-ubuntu-latest-full-execution.log
            ci-logs/quasar-ubuntu-latest-full-logs.tar.gz

  build-debian-12:
    name: Build, Test & Package (debian-12)
    needs: runner-diagnostics
    runs-on: debian-12
    if: always() && startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')

    steps:
      - name: "Diagnostic: Environment, Pre-Matrix & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_NEEDS: ${{ toJSON(needs) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 01] Diagnostic: Environment, Pre-Matrix & Runner Context (debian-12) ==="
            echo "=== UTC Timestamp ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "=== Host / Container OS & Hardware ==="
            cat /etc/os-release 2>/dev/null || true
            uname -a
            hostname -f 2>/dev/null || hostname || true
            id
            pwd
            nproc || true
            free -h || true
            df -hT . || true
            cat /run/.containerenv 2>/dev/null || ls -la /.dockerenv 2>/dev/null || true
            cat /proc/1/cgroup 2>/dev/null || true
            cat /etc/resolv.conf 2>/dev/null || true
            echo "=== Pre-Matrix Discovery Outputs (needs) ==="
            printf '%s\n' "$CTX_NEEDS"
            echo "=== Runner & Job Context ==="
            printf '%s\n' "$CTX_RUNNER"
            printf '%s\n' "$CTX_JOB"
            echo "=== Strategy / Matrix Context ==="
            printf '%s\n' "$CTX_STRATEGY"
            printf '%s\n' "$CTX_MATRIX"
            echo "=== Gitea Context (token redacted) ==="
            printf '%s\n' "$CTX_GITEA" | sed -E 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'
            echo "=== Environment Variables (redacted) ==="
            unset CTX_RUNNER CTX_JOB CTX_NEEDS CTX_STRATEGY CTX_MATRIX CTX_GITEA
            env | sort | sed -E 's/^([^=]*(TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)[^=]*)=.*/\1=***/I'
            if ! command -v node >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
              echo "=== Bootstrapping Node.js and Git for gitea-release-action ==="
              apt-get update
              apt-get install -y --no-install-recommends nodejs git ca-certificates
            fi
          ) 2>&1 | tee -a "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
          cp -f "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-debian-12-01-first-analysis.log"

      - name: Push First Analysis Step Logs
        id: push-first-analysis-logs
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            /tmp/quasar-ci-logs-debian-12/quasar-debian-12-01-first-analysis.log

      - name: Install Node.js and Git Prerequisites (Debian)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 02] Push First Analysis Step Logs Action Status ==="
            echo "outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
          } | tee -a "$LOG_DIR/02-action-push-first-analysis-logs.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 03] Install Node.js and Git Prerequisites (Debian) ==="
            apt-get update
            apt-get install -y --no-install-recommends nodejs git ca-certificates
            node --version
            git --version
          ) 2>&1 | tee -a "$LOG_DIR/03-install-prerequisites.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
          rm -rf ci-logs

      - name: Checkout Quasar
        id: checkout-quasar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Diagnostic: Post-Checkout Git & Submodule State"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 04] Checkout Quasar Action Status ==="
            echo "outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
          } | tee -a "$LOG_DIR/04-action-checkout-quasar.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 05] Diagnostic: Post-Checkout Git & Submodule State ==="
            ls -la
            git status -sb || true
            git branch -a || true
            git remote -v || true
            git log -n 5 --oneline --decorate || true
            git submodule status --recursive || true
            ls -la cmake-projects doc linux-modules 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/05-diagnostic-post-checkout.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Install dependencies (Debian)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 06] Install dependencies (Debian) ==="
            apt-get update
            apt-get install -y --no-install-recommends build-essential ccache cmake g++ make pkg-config python3 file linux-headers-amd64 \
                                libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
                                libgmp-dev libssl-dev libsasl2-dev libzstd-dev uuid-dev binutils-dev libbfd-dev zlib1g-dev libiberty-dev libcurl4-openssl-dev gdb \
                                curl npm python3-pip python3-venv plantuml default-jre graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 autoconf automake libtool
          ) 2>&1 | tee -a "$LOG_DIR/06-install-dependencies.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: "Diagnostic: Workspace, Toolchain, Compilers & Libraries Check"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 07] Diagnostic: Workspace, Toolchain, Compilers & Libraries Check ==="
            echo "=== Workspace Files ==="
            ls -la
            echo "=== Available Tools & Versions ==="
            for cmd in node npm git python3 pip3 cmake ctest cpack ccache gcc g++ ld make gdb pkg-config plantuml dot java dpkg dpkg-deb mvn podman docker curl; do
              if command -v "$cmd" >/dev/null 2>&1; then
                printf "%-12s %s\n" "$cmd:" "$(command -v "$cmd")"
              else
                printf "%-12s missing\n" "$cmd:"
              fi
            done
            cmake --version || true
            gcc --version | head -n 1 || true
            g++ --version | head -n 1 || true
            python3 --version || true
            node --version || true
            java -version 2>&1 || true
            ccache --version | head -n 1 || true
            gdb --version | head -n 1 || true
            echo "=== pkg-config Libraries (subset) ==="
            pkg-config --list-all 2>/dev/null | grep -iE 'alsa|x11|gl|ssl|zstd|uuid|curl|yaml|tinyxml|zlib|pango' | sort || true
          ) 2>&1 | tee -a "$LOG_DIR/07-diagnostic-toolchain.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Restore ccache
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: debian-12-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          restore-keys: |
            debian-12-ccache-${{ gitea.sha }}-
            debian-12-ccache-

      - name: "Diagnostic: Pre-Configure ccache & CMake Environment"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 08] Restore ccache Action Status ==="
            echo "outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
          } | tee -a "$LOG_DIR/08-action-restore-ccache.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 09] Diagnostic: Pre-Configure ccache & CMake Environment ==="
            mkdir -p .ccache
            ccache -s || true
          ) 2>&1 | tee -a "$LOG_DIR/09-diagnostic-pre-configure.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: Configure CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 10] Configure CMake Projects ==="
            mkdir -p build-projects
            cmake -S cmake-projects -B build-projects \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/10-configure-cmake.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Post-Configure CMake Cache & Discovered Tests"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 11] Diagnostic: Post-Configure CMake Cache & Discovered Tests ==="
            ls -la build-projects
            grep -E '^(CMAKE_BUILD_TYPE|CMAKE_CXX_COMPILER|CMAKE_C_COMPILER|CMAKE_CXX_FLAGS|BUILD_TESTING):' build-projects/CMakeCache.txt 2>/dev/null || true
            ctest --test-dir build-projects -N || true
          ) 2>&1 | tee -a "$LOG_DIR/11-diagnostic-post-configure.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Build CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 12] Build CMake Projects ==="
            ccache -z
            CPUS=$(nproc 2>/dev/null || echo 2)
            MEM_AVAIL_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)
            # Reserve ~4 GiB per concurrent C++23 -O3 compilation slot (0B swap on runner), capped at 2
            MEM_JOBS=$(( MEM_AVAIL_KB / 4194304 ))
            if [ "$MEM_JOBS" -lt 1 ]; then MEM_JOBS=1; fi
            BUILD_JOBS=$(( CPUS < MEM_JOBS ? CPUS : MEM_JOBS ))
            if [ "$BUILD_JOBS" -gt 2 ]; then BUILD_JOBS=2; fi
            echo "Build parallelism: BUILD_JOBS=$BUILD_JOBS (nproc=$CPUS, MemAvailable=${MEM_AVAIL_KB}kB)"
            free -h || true
            cmake --build build-projects --target liblua quasar_coretypes quasar_named utils --parallel "$BUILD_JOBS" --verbose
            # Build sol2-heavy quasar_scripting sequentially so RegistryBindings.cpp has full RAM headroom
            cmake --build build-projects --target quasar_scripting --parallel 1 --verbose
            cmake --build build-projects --parallel "$BUILD_JOBS" --verbose
            free -h || true
            ccache -s
          ) 2>&1 | tee -a "$LOG_DIR/12-build-cmake.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Build Outputs & Binaries Inspection"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 13] Diagnostic: Build Outputs & Binaries Inspection ==="
            ls -la build-projects
            ls -la build-projects/bin 2>/dev/null || true
            ls -la build-projects/lib 2>/dev/null || true
            du -sh build-projects .ccache 2>/dev/null || true
            if [ -x ./build-projects/bin/scripting_test ]; then
              file ./build-projects/bin/scripting_test || true
              ldd ./build-projects/bin/scripting_test || true
            fi
          ) 2>&1 | tee -a "$LOG_DIR/13-diagnostic-build-outputs.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Test CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 14] Test CMake Projects ==="
            ctest --test-dir build-projects --verbose --output-on-failure --repeat until-pass:99 -E "GoogleTestVerification|VerifyPermissionSkippingOnStart"
          ) 2>&1 | tee -a "$LOG_DIR/14-test-cmake.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Run Stress Tests in GDB
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 15] Run Stress Tests in GDB ==="
            ls -lh ./build-projects/bin/scripting_test || true
            gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"
          ) 2>&1 | tee -a "$LOG_DIR/15-stress-tests-gdb.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Package (Debian/RPM/TGZ)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 16] Package (Debian/RPM/TGZ) ==="
            cd build-projects
            if command -v dpkg > /dev/null; then
              cpack -V -G DEB
            elif command -v rpmbuild > /dev/null; then
              cpack -V -G RPM
            else
              cpack -V -G TGZ
            fi
            ls -lh *.deb *.rpm *.tar.gz 2>/dev/null || true
            for pkg in *.deb; do [ -f "$pkg" ] && dpkg-deb -I "$pkg" || true; done
          ) 2>&1 | tee -a "$LOG_DIR/16-package-cpack.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Checkout MkDocs Kit
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 17] Checkout MkDocs Kit ==="
            rm -rf .cache/mkdocs-kit
            mkdir -p .cache
            git clone --depth=1 --verbose https://github.com/mlecabellec/mkdocs-kit.git .cache/mkdocs-kit
            git -C .cache/mkdocs-kit log -1 --oneline || true
          ) 2>&1 | tee -a "$LOG_DIR/17-checkout-mkdocs-kit.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Build Documentation
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 18] Build Documentation ==="
            python3 -m venv .venv-docs
            .venv-docs/bin/pip install -v --upgrade pip
            .venv-docs/bin/pip install -v "setuptools<82.0.0"
            .venv-docs/bin/pip install -v ./.cache/mkdocs-kit
            cd doc
            ls -la
            ../.venv-docs/bin/mkdocs-kit build -v
            cp -f mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log" 2>/dev/null || true
            tail -n 80 mkdocs-kit.log 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/18-build-documentation.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: "Diagnostic: Pre-Upload Artifacts Inventory"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR" release-assets
          (
            set -x
            echo "=== [STEP 19] Diagnostic: Pre-Upload Artifacts Inventory ==="
            ls -lh build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz doc/documentation.pdf doc/mkdocs-kit.log 2>/dev/null || true
            ls -la doc/site/ 2>/dev/null || true
            for pkg in build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz; do
              if [ -f "$pkg" ]; then
                cp -f "$pkg" "release-assets/quasar-pkg-debian-12-$(basename "$pkg")"
              fi
            done
            if [ -d doc/site ]; then
              tar -czf "release-assets/quasar-docs-site-debian-12.tar.gz" -C doc site
            fi
            if [ -f doc/documentation.pdf ]; then
              cp -f doc/documentation.pdf "release-assets/quasar-documentation-debian-12.pdf"
            fi
            if [ -f doc/mkdocs-kit.log ]; then
              cp -f doc/mkdocs-kit.log "release-assets/quasar-mkdocs-kit-debian-12.log"
              cp -f doc/mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log"
            fi
            ls -lh release-assets/ 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/19-pre-upload-inventory.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Upload Artifacts
        id: release-artifacts
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            release-assets/quasar-pkg-debian-12-*
            release-assets/quasar-docs-site-debian-12.tar.gz
            release-assets/quasar-documentation-debian-12.pdf
            release-assets/quasar-mkdocs-kit-debian-12.log

      - name: Configure Linux Modules (EtherCAT)
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 20] Upload Artifacts Action Status ==="
            echo "outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
          } | tee -a "$LOG_DIR/20-action-release-artifacts.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 21] Configure Linux Modules (EtherCAT) ==="
            cmake -S linux-modules -B build-modules --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/21-configure-linux-modules.log" "$LOG_DIR/quasar-debian-12-full-execution.log"

      - name: Save ccache
        id: ccache-save
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: debian-12-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-12"
          mkdir -p "$LOG_DIR" ci-logs
          for extra_log in \
            build-projects/CMakeFiles/CMakeConfigureLog.yaml \
            build-projects/Testing/Temporary/LastTest.log \
            build-projects/Testing/Temporary/LastTestsFailed.log \
            build-modules/CMakeFiles/CMakeConfigureLog.yaml \
            doc/mkdocs-kit.log; do
            if [ -f "$extra_log" ]; then
              cp -f "$extra_log" "$LOG_DIR/$(echo "$extra_log" | tr '/' '_')" 2>/dev/null || true
            fi
          done
          {
            echo "=== [STEP 22] Action Steps Status Summary (debian-12) ==="
            echo "push-first-analysis-logs: outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
            echo "checkout-quasar:          outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
            echo "ccache-restore:           outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
            echo "release-artifacts:        outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
            echo "ccache-save:              outcome=${{ steps.ccache-save.outcome }} conclusion=${{ steps.ccache-save.conclusion }}"
          } | tee -a "$LOG_DIR/22-action-steps-summary.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
          (
            echo "=== [STEP 23] Diagnostic: Post-Run Summary (debian-12) ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "Job Status: ${{ job.status }}"
            free -h || true
            df -h . || true
            du -sh * .cache .ccache .venv-docs build-* 2>/dev/null || true
            ccache -s 2>/dev/null || true
            ls -la
            ls -lh "$LOG_DIR" || true
          ) 2>&1 | tee -a "$LOG_DIR/23-post-run-summary.log" "$LOG_DIR/quasar-debian-12-full-execution.log"
          cp -f "$LOG_DIR/quasar-debian-12-full-execution.log" "ci-logs/quasar-debian-12-full-execution.log"
          tar -czf "ci-logs/quasar-debian-12-full-logs.tar.gz" -C "$LOG_DIR" .
          ls -lh ci-logs/

      - name: Push Full Execution Logs
        id: push-full-execution-logs
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            ci-logs/quasar-debian-12-full-execution.log
            ci-logs/quasar-debian-12-full-logs.tar.gz

  build-debian-13:
    name: Build, Test & Package (debian-13)
    needs: runner-diagnostics
    runs-on: debian-13
    if: always() && startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')
    continue-on-error: true

    steps:
      - name: "Diagnostic: Environment, Pre-Matrix & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_NEEDS: ${{ toJSON(needs) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 01] Diagnostic: Environment, Pre-Matrix & Runner Context (debian-13) ==="
            echo "=== UTC Timestamp ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "=== Host / Container OS & Hardware ==="
            cat /etc/os-release 2>/dev/null || true
            uname -a
            hostname -f 2>/dev/null || hostname || true
            id
            pwd
            nproc || true
            free -h || true
            df -hT . || true
            cat /run/.containerenv 2>/dev/null || ls -la /.dockerenv 2>/dev/null || true
            cat /proc/1/cgroup 2>/dev/null || true
            cat /etc/resolv.conf 2>/dev/null || true
            echo "=== Pre-Matrix Discovery Outputs (needs) ==="
            printf '%s\n' "$CTX_NEEDS"
            echo "=== Runner & Job Context ==="
            printf '%s\n' "$CTX_RUNNER"
            printf '%s\n' "$CTX_JOB"
            echo "=== Strategy / Matrix Context ==="
            printf '%s\n' "$CTX_STRATEGY"
            printf '%s\n' "$CTX_MATRIX"
            echo "=== Gitea Context (token redacted) ==="
            printf '%s\n' "$CTX_GITEA" | sed -E 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'
            echo "=== Environment Variables (redacted) ==="
            unset CTX_RUNNER CTX_JOB CTX_NEEDS CTX_STRATEGY CTX_MATRIX CTX_GITEA
            env | sort | sed -E 's/^([^=]*(TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)[^=]*)=.*/\1=***/I'
            if ! command -v node >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
              echo "=== Bootstrapping Node.js and Git for gitea-release-action ==="
              apt-get update
              apt-get install -y --no-install-recommends nodejs git ca-certificates
            fi
          ) 2>&1 | tee -a "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
          cp -f "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-debian-13-01-first-analysis.log"

      - name: Push First Analysis Step Logs
        id: push-first-analysis-logs
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            /tmp/quasar-ci-logs-debian-13/quasar-debian-13-01-first-analysis.log

      - name: Install Node.js and Git Prerequisites (Debian)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 02] Push First Analysis Step Logs Action Status ==="
            echo "outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
          } | tee -a "$LOG_DIR/02-action-push-first-analysis-logs.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 03] Install Node.js and Git Prerequisites (Debian) ==="
            apt-get update
            apt-get install -y --no-install-recommends nodejs git ca-certificates
            node --version
            git --version
          ) 2>&1 | tee -a "$LOG_DIR/03-install-prerequisites.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
          rm -rf ci-logs

      - name: Checkout Quasar
        id: checkout-quasar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Diagnostic: Post-Checkout Git & Submodule State"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 04] Checkout Quasar Action Status ==="
            echo "outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
          } | tee -a "$LOG_DIR/04-action-checkout-quasar.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 05] Diagnostic: Post-Checkout Git & Submodule State ==="
            ls -la
            git status -sb || true
            git branch -a || true
            git remote -v || true
            git log -n 5 --oneline --decorate || true
            git submodule status --recursive || true
            ls -la cmake-projects doc linux-modules 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/05-diagnostic-post-checkout.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Install dependencies (Debian)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 06] Install dependencies (Debian) ==="
            apt-get update
            apt-get install -y --no-install-recommends build-essential ccache cmake g++ make pkg-config python3 file linux-headers-amd64 \
                                libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
                                libgmp-dev libssl-dev libsasl2-dev libzstd-dev uuid-dev binutils-dev libbfd-dev zlib1g-dev libiberty-dev libcurl4-openssl-dev gdb \
                                curl npm python3-pip python3-venv plantuml default-jre graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 autoconf automake libtool
          ) 2>&1 | tee -a "$LOG_DIR/06-install-dependencies.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: "Diagnostic: Workspace, Toolchain, Compilers & Libraries Check"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 07] Diagnostic: Workspace, Toolchain, Compilers & Libraries Check ==="
            echo "=== Workspace Files ==="
            ls -la
            echo "=== Available Tools & Versions ==="
            for cmd in node npm git python3 pip3 cmake ctest cpack ccache gcc g++ ld make gdb pkg-config plantuml dot java dpkg dpkg-deb mvn podman docker curl; do
              if command -v "$cmd" >/dev/null 2>&1; then
                printf "%-12s %s\n" "$cmd:" "$(command -v "$cmd")"
              else
                printf "%-12s missing\n" "$cmd:"
              fi
            done
            cmake --version || true
            gcc --version | head -n 1 || true
            g++ --version | head -n 1 || true
            python3 --version || true
            node --version || true
            java -version 2>&1 || true
            ccache --version | head -n 1 || true
            gdb --version | head -n 1 || true
            echo "=== pkg-config Libraries (subset) ==="
            pkg-config --list-all 2>/dev/null | grep -iE 'alsa|x11|gl|ssl|zstd|uuid|curl|yaml|tinyxml|zlib|pango' | sort || true
          ) 2>&1 | tee -a "$LOG_DIR/07-diagnostic-toolchain.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Restore ccache
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: debian-13-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          restore-keys: |
            debian-13-ccache-${{ gitea.sha }}-
            debian-13-ccache-

      - name: "Diagnostic: Pre-Configure ccache & CMake Environment"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 08] Restore ccache Action Status ==="
            echo "outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
          } | tee -a "$LOG_DIR/08-action-restore-ccache.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 09] Diagnostic: Pre-Configure ccache & CMake Environment ==="
            mkdir -p .ccache
            ccache -s || true
          ) 2>&1 | tee -a "$LOG_DIR/09-diagnostic-pre-configure.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: Configure CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 10] Configure CMake Projects ==="
            mkdir -p build-projects
            cmake -S cmake-projects -B build-projects \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/10-configure-cmake.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Post-Configure CMake Cache & Discovered Tests"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 11] Diagnostic: Post-Configure CMake Cache & Discovered Tests ==="
            ls -la build-projects
            grep -E '^(CMAKE_BUILD_TYPE|CMAKE_CXX_COMPILER|CMAKE_C_COMPILER|CMAKE_CXX_FLAGS|BUILD_TESTING):' build-projects/CMakeCache.txt 2>/dev/null || true
            ctest --test-dir build-projects -N || true
          ) 2>&1 | tee -a "$LOG_DIR/11-diagnostic-post-configure.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Build CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 12] Build CMake Projects ==="
            ccache -z
            CPUS=$(nproc 2>/dev/null || echo 2)
            MEM_AVAIL_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)
            # Reserve ~4 GiB per concurrent C++23 -O3 compilation slot (0B swap on runner), capped at 2
            MEM_JOBS=$(( MEM_AVAIL_KB / 4194304 ))
            if [ "$MEM_JOBS" -lt 1 ]; then MEM_JOBS=1; fi
            BUILD_JOBS=$(( CPUS < MEM_JOBS ? CPUS : MEM_JOBS ))
            if [ "$BUILD_JOBS" -gt 2 ]; then BUILD_JOBS=2; fi
            echo "Build parallelism: BUILD_JOBS=$BUILD_JOBS (nproc=$CPUS, MemAvailable=${MEM_AVAIL_KB}kB)"
            free -h || true
            cmake --build build-projects --target liblua quasar_coretypes quasar_named utils --parallel "$BUILD_JOBS" --verbose
            # Build sol2-heavy quasar_scripting sequentially so RegistryBindings.cpp has full RAM headroom
            cmake --build build-projects --target quasar_scripting --parallel 1 --verbose
            cmake --build build-projects --parallel "$BUILD_JOBS" --verbose
            free -h || true
            ccache -s
          ) 2>&1 | tee -a "$LOG_DIR/12-build-cmake.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Build Outputs & Binaries Inspection"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 13] Diagnostic: Build Outputs & Binaries Inspection ==="
            ls -la build-projects
            ls -la build-projects/bin 2>/dev/null || true
            ls -la build-projects/lib 2>/dev/null || true
            du -sh build-projects .ccache 2>/dev/null || true
            if [ -x ./build-projects/bin/scripting_test ]; then
              file ./build-projects/bin/scripting_test || true
              ldd ./build-projects/bin/scripting_test || true
            fi
          ) 2>&1 | tee -a "$LOG_DIR/13-diagnostic-build-outputs.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Test CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 14] Test CMake Projects ==="
            ctest --test-dir build-projects --verbose --output-on-failure --repeat until-pass:99 -E "GoogleTestVerification|VerifyPermissionSkippingOnStart"
          ) 2>&1 | tee -a "$LOG_DIR/14-test-cmake.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Run Stress Tests in GDB
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 15] Run Stress Tests in GDB ==="
            ls -lh ./build-projects/bin/scripting_test || true
            gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"
          ) 2>&1 | tee -a "$LOG_DIR/15-stress-tests-gdb.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Package (Debian/RPM/TGZ)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 16] Package (Debian/RPM/TGZ) ==="
            cd build-projects
            if command -v dpkg > /dev/null; then
              cpack -V -G DEB
            elif command -v rpmbuild > /dev/null; then
              cpack -V -G RPM
            else
              cpack -V -G TGZ
            fi
            ls -lh *.deb *.rpm *.tar.gz 2>/dev/null || true
            for pkg in *.deb; do [ -f "$pkg" ] && dpkg-deb -I "$pkg" || true; done
          ) 2>&1 | tee -a "$LOG_DIR/16-package-cpack.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Checkout MkDocs Kit
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 17] Checkout MkDocs Kit ==="
            rm -rf .cache/mkdocs-kit
            mkdir -p .cache
            git clone --depth=1 --verbose https://github.com/mlecabellec/mkdocs-kit.git .cache/mkdocs-kit
            git -C .cache/mkdocs-kit log -1 --oneline || true
          ) 2>&1 | tee -a "$LOG_DIR/17-checkout-mkdocs-kit.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Build Documentation
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 18] Build Documentation ==="
            python3 -m venv .venv-docs
            .venv-docs/bin/pip install -v --upgrade pip
            .venv-docs/bin/pip install -v "setuptools<82.0.0"
            .venv-docs/bin/pip install -v ./.cache/mkdocs-kit
            cd doc
            ls -la
            ../.venv-docs/bin/mkdocs-kit build -v
            cp -f mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log" 2>/dev/null || true
            tail -n 80 mkdocs-kit.log 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/18-build-documentation.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: "Diagnostic: Pre-Upload Artifacts Inventory"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR" release-assets
          (
            set -x
            echo "=== [STEP 19] Diagnostic: Pre-Upload Artifacts Inventory ==="
            ls -lh build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz doc/documentation.pdf doc/mkdocs-kit.log 2>/dev/null || true
            ls -la doc/site/ 2>/dev/null || true
            for pkg in build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz; do
              if [ -f "$pkg" ]; then
                cp -f "$pkg" "release-assets/quasar-pkg-debian-13-$(basename "$pkg")"
              fi
            done
            if [ -d doc/site ]; then
              tar -czf "release-assets/quasar-docs-site-debian-13.tar.gz" -C doc site
            fi
            if [ -f doc/documentation.pdf ]; then
              cp -f doc/documentation.pdf "release-assets/quasar-documentation-debian-13.pdf"
            fi
            if [ -f doc/mkdocs-kit.log ]; then
              cp -f doc/mkdocs-kit.log "release-assets/quasar-mkdocs-kit-debian-13.log"
              cp -f doc/mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log"
            fi
            ls -lh release-assets/ 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/19-pre-upload-inventory.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Upload Artifacts
        id: release-artifacts
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            release-assets/quasar-pkg-debian-13-*
            release-assets/quasar-docs-site-debian-13.tar.gz
            release-assets/quasar-documentation-debian-13.pdf
            release-assets/quasar-mkdocs-kit-debian-13.log

      - name: Configure Linux Modules (EtherCAT)
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 20] Upload Artifacts Action Status ==="
            echo "outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
          } | tee -a "$LOG_DIR/20-action-release-artifacts.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 21] Configure Linux Modules (EtherCAT) ==="
            cmake -S linux-modules -B build-modules --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/21-configure-linux-modules.log" "$LOG_DIR/quasar-debian-13-full-execution.log"

      - name: Save ccache
        id: ccache-save
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: debian-13-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-debian-13"
          mkdir -p "$LOG_DIR" ci-logs
          for extra_log in \
            build-projects/CMakeFiles/CMakeConfigureLog.yaml \
            build-projects/Testing/Temporary/LastTest.log \
            build-projects/Testing/Temporary/LastTestsFailed.log \
            build-modules/CMakeFiles/CMakeConfigureLog.yaml \
            doc/mkdocs-kit.log; do
            if [ -f "$extra_log" ]; then
              cp -f "$extra_log" "$LOG_DIR/$(echo "$extra_log" | tr '/' '_')" 2>/dev/null || true
            fi
          done
          {
            echo "=== [STEP 22] Action Steps Status Summary (debian-13) ==="
            echo "push-first-analysis-logs: outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
            echo "checkout-quasar:          outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
            echo "ccache-restore:           outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
            echo "release-artifacts:        outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
            echo "ccache-save:              outcome=${{ steps.ccache-save.outcome }} conclusion=${{ steps.ccache-save.conclusion }}"
          } | tee -a "$LOG_DIR/22-action-steps-summary.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
          (
            echo "=== [STEP 23] Diagnostic: Post-Run Summary (debian-13) ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "Job Status: ${{ job.status }}"
            free -h || true
            df -h . || true
            du -sh * .cache .ccache .venv-docs build-* 2>/dev/null || true
            ccache -s 2>/dev/null || true
            ls -la
            ls -lh "$LOG_DIR" || true
          ) 2>&1 | tee -a "$LOG_DIR/23-post-run-summary.log" "$LOG_DIR/quasar-debian-13-full-execution.log"
          cp -f "$LOG_DIR/quasar-debian-13-full-execution.log" "ci-logs/quasar-debian-13-full-execution.log"
          tar -czf "ci-logs/quasar-debian-13-full-logs.tar.gz" -C "$LOG_DIR" .
          ls -lh ci-logs/

      - name: Push Full Execution Logs
        id: push-full-execution-logs
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            ci-logs/quasar-debian-13-full-execution.log
            ci-logs/quasar-debian-13-full-logs.tar.gz

  build-fedora:
    name: Build, Test & Package (fedora)
    needs: runner-diagnostics
    runs-on: fedora
    if: always() && startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')
    continue-on-error: true

    steps:
      - name: "Diagnostic: Environment, Pre-Matrix & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_NEEDS: ${{ toJSON(needs) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 01] Diagnostic: Environment, Pre-Matrix & Runner Context (fedora) ==="
            echo "=== UTC Timestamp ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "=== Host / Container OS & Hardware ==="
            cat /etc/os-release 2>/dev/null || true
            uname -a
            hostname -f 2>/dev/null || hostname || true
            id
            pwd
            nproc || true
            free -h || true
            df -hT . || true
            cat /run/.containerenv 2>/dev/null || ls -la /.dockerenv 2>/dev/null || true
            cat /proc/1/cgroup 2>/dev/null || true
            cat /etc/resolv.conf 2>/dev/null || true
            echo "=== Pre-Matrix Discovery Outputs (needs) ==="
            printf '%s\n' "$CTX_NEEDS"
            echo "=== Runner & Job Context ==="
            printf '%s\n' "$CTX_RUNNER"
            printf '%s\n' "$CTX_JOB"
            echo "=== Strategy / Matrix Context ==="
            printf '%s\n' "$CTX_STRATEGY"
            printf '%s\n' "$CTX_MATRIX"
            echo "=== Gitea Context (token redacted) ==="
            printf '%s\n' "$CTX_GITEA" | sed -E 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'
            echo "=== Environment Variables (redacted) ==="
            unset CTX_RUNNER CTX_JOB CTX_NEEDS CTX_STRATEGY CTX_MATRIX CTX_GITEA
            env | sort | sed -E 's/^([^=]*(TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)[^=]*)=.*/\1=***/I'
            if ! command -v node >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
              echo "=== Bootstrapping Node.js and Git for gitea-release-action ==="
              dnf install -y nodejs git ca-certificates
            fi
          ) 2>&1 | tee -a "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-fedora-full-execution.log"
          cp -f "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-fedora-01-first-analysis.log"

      - name: Push First Analysis Step Logs
        id: push-first-analysis-logs
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            /tmp/quasar-ci-logs-fedora/quasar-fedora-01-first-analysis.log

      - name: Install Node.js and Git Prerequisites (Fedora)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 02] Push First Analysis Step Logs Action Status ==="
            echo "outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
          } | tee -a "$LOG_DIR/02-action-push-first-analysis-logs.log" "$LOG_DIR/quasar-fedora-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 03] Install Node.js and Git Prerequisites (Fedora) ==="
            dnf install -y nodejs git ca-certificates
            node --version
            git --version
          ) 2>&1 | tee -a "$LOG_DIR/03-install-prerequisites.log" "$LOG_DIR/quasar-fedora-full-execution.log"
          rm -rf ci-logs

      - name: Checkout Quasar
        id: checkout-quasar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Diagnostic: Post-Checkout Git & Submodule State"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 04] Checkout Quasar Action Status ==="
            echo "outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
          } | tee -a "$LOG_DIR/04-action-checkout-quasar.log" "$LOG_DIR/quasar-fedora-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 05] Diagnostic: Post-Checkout Git & Submodule State ==="
            ls -la
            git status -sb || true
            git branch -a || true
            git remote -v || true
            git log -n 5 --oneline --decorate || true
            git submodule status --recursive || true
            ls -la cmake-projects doc linux-modules 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/05-diagnostic-post-checkout.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Install dependencies (Fedora)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 06] Install dependencies (Fedora) ==="
            dnf install -y gcc-c++ make cmake pkgconf-pkg-config python3 file \
                           kernel-devel autoconf automake libtool dkms rpm-build \
                           alsa-lib-devel libX11-devel libXrandr-devel libXi-devel \
                           mesa-libGL-devel mesa-libGLU-devel libXcursor-devel libXinerama-devel \
                           gmp-devel openssl-devel libuuid-devel zlib-devel binutils-devel \
                           yaml-cpp-devel tinyxml2-devel ccache gdb libzstd-devel \
                           curl npm python3-pip plantuml graphviz java-21-openjdk pango cairo
          ) 2>&1 | tee -a "$LOG_DIR/06-install-dependencies.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: "Diagnostic: Workspace, Toolchain, Compilers & Libraries Check"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 07] Diagnostic: Workspace, Toolchain, Compilers & Libraries Check ==="
            echo "=== Workspace Files ==="
            ls -la
            echo "=== Available Tools & Versions ==="
            for cmd in node npm git python3 pip3 cmake ctest cpack ccache gcc g++ ld make gdb pkg-config plantuml dot java rpmbuild rpm mvn podman docker curl; do
              if command -v "$cmd" >/dev/null 2>&1; then
                printf "%-12s %s\n" "$cmd:" "$(command -v "$cmd")"
              else
                printf "%-12s missing\n" "$cmd:"
              fi
            done
            cmake --version || true
            gcc --version | head -n 1 || true
            g++ --version | head -n 1 || true
            python3 --version || true
            node --version || true
            java -version 2>&1 || true
            ccache --version | head -n 1 || true
            gdb --version | head -n 1 || true
            echo "=== pkg-config Libraries (subset) ==="
            pkg-config --list-all 2>/dev/null | grep -iE 'alsa|x11|gl|ssl|zstd|uuid|curl|yaml|tinyxml|zlib|pango' | sort || true
          ) 2>&1 | tee -a "$LOG_DIR/07-diagnostic-toolchain.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Restore ccache
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: fedora-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          restore-keys: |
            fedora-ccache-${{ gitea.sha }}-
            fedora-ccache-

      - name: "Diagnostic: Pre-Configure ccache & CMake Environment"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 08] Restore ccache Action Status ==="
            echo "outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
          } | tee -a "$LOG_DIR/08-action-restore-ccache.log" "$LOG_DIR/quasar-fedora-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 09] Diagnostic: Pre-Configure ccache & CMake Environment ==="
            mkdir -p .ccache
            ccache -s || true
          ) 2>&1 | tee -a "$LOG_DIR/09-diagnostic-pre-configure.log" "$LOG_DIR/quasar-fedora-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: Configure CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 10] Configure CMake Projects ==="
            mkdir -p build-projects
            cmake -S cmake-projects -B build-projects \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/10-configure-cmake.log" "$LOG_DIR/quasar-fedora-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Post-Configure CMake Cache & Discovered Tests"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 11] Diagnostic: Post-Configure CMake Cache & Discovered Tests ==="
            ls -la build-projects
            grep -E '^(CMAKE_BUILD_TYPE|CMAKE_CXX_COMPILER|CMAKE_C_COMPILER|CMAKE_CXX_FLAGS|BUILD_TESTING):' build-projects/CMakeCache.txt 2>/dev/null || true
            ctest --test-dir build-projects -N || true
          ) 2>&1 | tee -a "$LOG_DIR/11-diagnostic-post-configure.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Build CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 12] Build CMake Projects ==="
            ccache -z
            CPUS=$(nproc 2>/dev/null || echo 2)
            MEM_AVAIL_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)
            # Reserve ~4 GiB per concurrent C++23 -O3 compilation slot (0B swap on runner), capped at 2
            MEM_JOBS=$(( MEM_AVAIL_KB / 4194304 ))
            if [ "$MEM_JOBS" -lt 1 ]; then MEM_JOBS=1; fi
            BUILD_JOBS=$(( CPUS < MEM_JOBS ? CPUS : MEM_JOBS ))
            if [ "$BUILD_JOBS" -gt 2 ]; then BUILD_JOBS=2; fi
            echo "Build parallelism: BUILD_JOBS=$BUILD_JOBS (nproc=$CPUS, MemAvailable=${MEM_AVAIL_KB}kB)"
            free -h || true
            cmake --build build-projects --target liblua quasar_coretypes quasar_named utils --parallel "$BUILD_JOBS" --verbose
            # Build sol2-heavy quasar_scripting sequentially so RegistryBindings.cpp has full RAM headroom
            cmake --build build-projects --target quasar_scripting --parallel 1 --verbose
            cmake --build build-projects --parallel "$BUILD_JOBS" --verbose
            free -h || true
            ccache -s
          ) 2>&1 | tee -a "$LOG_DIR/12-build-cmake.log" "$LOG_DIR/quasar-fedora-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Build Outputs & Binaries Inspection"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 13] Diagnostic: Build Outputs & Binaries Inspection ==="
            ls -la build-projects
            ls -la build-projects/bin 2>/dev/null || true
            ls -la build-projects/lib 2>/dev/null || true
            du -sh build-projects .ccache 2>/dev/null || true
            if [ -x ./build-projects/bin/scripting_test ]; then
              file ./build-projects/bin/scripting_test || true
              ldd ./build-projects/bin/scripting_test || true
            fi
          ) 2>&1 | tee -a "$LOG_DIR/13-diagnostic-build-outputs.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Test CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 14] Test CMake Projects ==="
            ctest --test-dir build-projects --verbose --output-on-failure --repeat until-pass:99 -E "GoogleTestVerification|VerifyPermissionSkippingOnStart"
          ) 2>&1 | tee -a "$LOG_DIR/14-test-cmake.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Run Stress Tests in GDB
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 15] Run Stress Tests in GDB ==="
            ls -lh ./build-projects/bin/scripting_test || true
            gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"
          ) 2>&1 | tee -a "$LOG_DIR/15-stress-tests-gdb.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Package (Debian/RPM/TGZ)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 16] Package (Debian/RPM/TGZ) ==="
            cd build-projects
            if command -v dpkg > /dev/null; then
              cpack -V -G DEB
            elif command -v rpmbuild > /dev/null; then
              cpack -V -G RPM
            else
              cpack -V -G TGZ
            fi
            ls -lh *.deb *.rpm *.tar.gz 2>/dev/null || true
            for pkg in *.rpm; do [ -f "$pkg" ] && rpm -qip "$pkg" || true; done
          ) 2>&1 | tee -a "$LOG_DIR/16-package-cpack.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Checkout MkDocs Kit
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 17] Checkout MkDocs Kit ==="
            rm -rf .cache/mkdocs-kit
            mkdir -p .cache
            git clone --depth=1 --verbose https://github.com/mlecabellec/mkdocs-kit.git .cache/mkdocs-kit
            git -C .cache/mkdocs-kit log -1 --oneline || true
          ) 2>&1 | tee -a "$LOG_DIR/17-checkout-mkdocs-kit.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Build Documentation
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 18] Build Documentation ==="
            python3 -m venv .venv-docs
            .venv-docs/bin/pip install -v --upgrade pip
            .venv-docs/bin/pip install -v "setuptools<82.0.0"
            .venv-docs/bin/pip install -v ./.cache/mkdocs-kit
            cd doc
            ls -la
            ../.venv-docs/bin/mkdocs-kit build -v
            cp -f mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log" 2>/dev/null || true
            tail -n 80 mkdocs-kit.log 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/18-build-documentation.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: "Diagnostic: Pre-Upload Artifacts Inventory"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR" release-assets
          (
            set -x
            echo "=== [STEP 19] Diagnostic: Pre-Upload Artifacts Inventory ==="
            ls -lh build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz doc/documentation.pdf doc/mkdocs-kit.log 2>/dev/null || true
            ls -la doc/site/ 2>/dev/null || true
            for pkg in build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz; do
              if [ -f "$pkg" ]; then
                cp -f "$pkg" "release-assets/quasar-pkg-fedora-$(basename "$pkg")"
              fi
            done
            if [ -d doc/site ]; then
              tar -czf "release-assets/quasar-docs-site-fedora.tar.gz" -C doc site
            fi
            if [ -f doc/documentation.pdf ]; then
              cp -f doc/documentation.pdf "release-assets/quasar-documentation-fedora.pdf"
            fi
            if [ -f doc/mkdocs-kit.log ]; then
              cp -f doc/mkdocs-kit.log "release-assets/quasar-mkdocs-kit-fedora.log"
              cp -f doc/mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log"
            fi
            ls -lh release-assets/ 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/19-pre-upload-inventory.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Upload Artifacts
        id: release-artifacts
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            release-assets/quasar-pkg-fedora-*
            release-assets/quasar-docs-site-fedora.tar.gz
            release-assets/quasar-documentation-fedora.pdf
            release-assets/quasar-mkdocs-kit-fedora.log

      - name: Configure Linux Modules (EtherCAT)
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 20] Upload Artifacts Action Status ==="
            echo "outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
          } | tee -a "$LOG_DIR/20-action-release-artifacts.log" "$LOG_DIR/quasar-fedora-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 21] Configure Linux Modules (EtherCAT) ==="
            cmake -S linux-modules -B build-modules --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/21-configure-linux-modules.log" "$LOG_DIR/quasar-fedora-full-execution.log"

      - name: Save ccache
        id: ccache-save
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: fedora-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-fedora"
          mkdir -p "$LOG_DIR" ci-logs
          for extra_log in \
            build-projects/CMakeFiles/CMakeConfigureLog.yaml \
            build-projects/Testing/Temporary/LastTest.log \
            build-projects/Testing/Temporary/LastTestsFailed.log \
            build-modules/CMakeFiles/CMakeConfigureLog.yaml \
            doc/mkdocs-kit.log; do
            if [ -f "$extra_log" ]; then
              cp -f "$extra_log" "$LOG_DIR/$(echo "$extra_log" | tr '/' '_')" 2>/dev/null || true
            fi
          done
          {
            echo "=== [STEP 22] Action Steps Status Summary (fedora) ==="
            echo "push-first-analysis-logs: outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
            echo "checkout-quasar:          outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
            echo "ccache-restore:           outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
            echo "release-artifacts:        outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
            echo "ccache-save:              outcome=${{ steps.ccache-save.outcome }} conclusion=${{ steps.ccache-save.conclusion }}"
          } | tee -a "$LOG_DIR/22-action-steps-summary.log" "$LOG_DIR/quasar-fedora-full-execution.log"
          (
            echo "=== [STEP 23] Diagnostic: Post-Run Summary (fedora) ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "Job Status: ${{ job.status }}"
            free -h || true
            df -h . || true
            du -sh * .cache .ccache .venv-docs build-* 2>/dev/null || true
            ccache -s 2>/dev/null || true
            ls -la
            ls -lh "$LOG_DIR" || true
          ) 2>&1 | tee -a "$LOG_DIR/23-post-run-summary.log" "$LOG_DIR/quasar-fedora-full-execution.log"
          cp -f "$LOG_DIR/quasar-fedora-full-execution.log" "ci-logs/quasar-fedora-full-execution.log"
          tar -czf "ci-logs/quasar-fedora-full-logs.tar.gz" -C "$LOG_DIR" .
          ls -lh ci-logs/

      - name: Push Full Execution Logs
        id: push-full-execution-logs
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            ci-logs/quasar-fedora-full-execution.log
            ci-logs/quasar-fedora-full-logs.tar.gz

  build-archlinux:
    name: Build, Test & Package (archlinux)
    needs: runner-diagnostics
    runs-on: archlinux
    if: always() && startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')
    continue-on-error: true

    steps:
      - name: "Diagnostic: Environment, Pre-Matrix & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_NEEDS: ${{ toJSON(needs) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 01] Diagnostic: Environment, Pre-Matrix & Runner Context (archlinux) ==="
            echo "=== UTC Timestamp ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "=== Host / Container OS & Hardware ==="
            cat /etc/os-release 2>/dev/null || true
            uname -a
            hostname -f 2>/dev/null || hostname || true
            id
            pwd
            nproc || true
            free -h || true
            df -hT . || true
            cat /run/.containerenv 2>/dev/null || ls -la /.dockerenv 2>/dev/null || true
            cat /proc/1/cgroup 2>/dev/null || true
            cat /etc/resolv.conf 2>/dev/null || true
            echo "=== Pre-Matrix Discovery Outputs (needs) ==="
            printf '%s\n' "$CTX_NEEDS"
            echo "=== Runner & Job Context ==="
            printf '%s\n' "$CTX_RUNNER"
            printf '%s\n' "$CTX_JOB"
            echo "=== Strategy / Matrix Context ==="
            printf '%s\n' "$CTX_STRATEGY"
            printf '%s\n' "$CTX_MATRIX"
            echo "=== Gitea Context (token redacted) ==="
            printf '%s\n' "$CTX_GITEA" | sed -E 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'
            echo "=== Environment Variables (redacted) ==="
            unset CTX_RUNNER CTX_JOB CTX_NEEDS CTX_STRATEGY CTX_MATRIX CTX_GITEA
            env | sort | sed -E 's/^([^=]*(TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)[^=]*)=.*/\1=***/I'
            if ! command -v node >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
              echo "=== Bootstrapping Node.js and Git for gitea-release-action ==="
              pacman -Sy --noconfirm nodejs git ca-certificates
            fi
          ) 2>&1 | tee -a "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
          cp -f "$LOG_DIR/01-diagnostic-environment.log" "$LOG_DIR/quasar-archlinux-01-first-analysis.log"

      - name: Push First Analysis Step Logs
        id: push-first-analysis-logs
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            /tmp/quasar-ci-logs-archlinux/quasar-archlinux-01-first-analysis.log

      - name: Install Node.js and Git Prerequisites (Arch Linux)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 02] Push First Analysis Step Logs Action Status ==="
            echo "outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
          } | tee -a "$LOG_DIR/02-action-push-first-analysis-logs.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 03] Install Node.js and Git Prerequisites (Arch Linux) ==="
            pacman -Sy --noconfirm nodejs git ca-certificates
            node --version
            git --version
          ) 2>&1 | tee -a "$LOG_DIR/03-install-prerequisites.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
          rm -rf ci-logs

      - name: Checkout Quasar
        id: checkout-quasar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Diagnostic: Post-Checkout Git & Submodule State"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 04] Checkout Quasar Action Status ==="
            echo "outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
          } | tee -a "$LOG_DIR/04-action-checkout-quasar.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 05] Diagnostic: Post-Checkout Git & Submodule State ==="
            ls -la
            git status -sb || true
            git branch -a || true
            git remote -v || true
            git log -n 5 --oneline --decorate || true
            git submodule status --recursive || true
            ls -la cmake-projects doc linux-modules 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/05-diagnostic-post-checkout.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Install dependencies (Arch Linux)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 06] Install dependencies (Arch Linux) ==="
            pacman -S --needed --noconfirm \
                           base-devel cmake python file \
                           linux-headers autoconf automake libtool dkms \
                           alsa-lib libx11 libxrandr libxi mesa glu libxcursor libxinerama \
                           gmp openssl util-linux-libs zlib binutils yaml-cpp tinyxml2 ccache gdb \
                           curl npm python-pip plantuml graphviz jre-openjdk pango cairo
          ) 2>&1 | tee -a "$LOG_DIR/06-install-dependencies.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: "Diagnostic: Workspace, Toolchain, Compilers & Libraries Check"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            echo "=== [STEP 07] Diagnostic: Workspace, Toolchain, Compilers & Libraries Check ==="
            echo "=== Workspace Files ==="
            ls -la
            echo "=== Available Tools & Versions ==="
            for cmd in node npm git python3 pip cmake ctest cpack ccache gcc g++ ld make gdb pkg-config plantuml dot java pacman mvn podman docker curl; do
              if command -v "$cmd" >/dev/null 2>&1; then
                printf "%-12s %s\n" "$cmd:" "$(command -v "$cmd")"
              else
                printf "%-12s missing\n" "$cmd:"
              fi
            done
            cmake --version || true
            gcc --version | head -n 1 || true
            g++ --version | head -n 1 || true
            python3 --version || true
            node --version || true
            java -version 2>&1 || true
            ccache --version | head -n 1 || true
            gdb --version | head -n 1 || true
            echo "=== pkg-config Libraries (subset) ==="
            pkg-config --list-all 2>/dev/null | grep -iE 'alsa|x11|gl|ssl|zstd|uuid|curl|yaml|tinyxml|zlib|pango' | sort || true
          ) 2>&1 | tee -a "$LOG_DIR/07-diagnostic-toolchain.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Restore ccache
        id: ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: archlinux-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          restore-keys: |
            archlinux-ccache-${{ gitea.sha }}-
            archlinux-ccache-

      - name: "Diagnostic: Pre-Configure ccache & CMake Environment"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 08] Restore ccache Action Status ==="
            echo "outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
          } | tee -a "$LOG_DIR/08-action-restore-ccache.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 09] Diagnostic: Pre-Configure ccache & CMake Environment ==="
            mkdir -p .ccache
            ccache -s || true
          ) 2>&1 | tee -a "$LOG_DIR/09-diagnostic-pre-configure.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: Configure CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 10] Configure CMake Projects ==="
            mkdir -p build-projects
            cmake -S cmake-projects -B build-projects \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/10-configure-cmake.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Post-Configure CMake Cache & Discovered Tests"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 11] Diagnostic: Post-Configure CMake Cache & Discovered Tests ==="
            ls -la build-projects
            grep -E '^(CMAKE_BUILD_TYPE|CMAKE_CXX_COMPILER|CMAKE_C_COMPILER|CMAKE_CXX_FLAGS|BUILD_TESTING):' build-projects/CMakeCache.txt 2>/dev/null || true
            ctest --test-dir build-projects -N || true
          ) 2>&1 | tee -a "$LOG_DIR/11-diagnostic-post-configure.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Build CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 12] Build CMake Projects ==="
            ccache -z
            CPUS=$(nproc 2>/dev/null || echo 2)
            MEM_AVAIL_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)
            # Reserve ~4 GiB per concurrent C++23 -O3 compilation slot (0B swap on runner), capped at 2
            MEM_JOBS=$(( MEM_AVAIL_KB / 4194304 ))
            if [ "$MEM_JOBS" -lt 1 ]; then MEM_JOBS=1; fi
            BUILD_JOBS=$(( CPUS < MEM_JOBS ? CPUS : MEM_JOBS ))
            if [ "$BUILD_JOBS" -gt 2 ]; then BUILD_JOBS=2; fi
            echo "Build parallelism: BUILD_JOBS=$BUILD_JOBS (nproc=$CPUS, MemAvailable=${MEM_AVAIL_KB}kB)"
            free -h || true
            cmake --build build-projects --target liblua quasar_coretypes quasar_named utils --parallel "$BUILD_JOBS" --verbose
            # Build sol2-heavy quasar_scripting sequentially so RegistryBindings.cpp has full RAM headroom
            cmake --build build-projects --target quasar_scripting --parallel 1 --verbose
            cmake --build build-projects --parallel "$BUILD_JOBS" --verbose
            free -h || true
            ccache -s
          ) 2>&1 | tee -a "$LOG_DIR/12-build-cmake.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Build Outputs & Binaries Inspection"
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 13] Diagnostic: Build Outputs & Binaries Inspection ==="
            ls -la build-projects
            ls -la build-projects/bin 2>/dev/null || true
            ls -la build-projects/lib 2>/dev/null || true
            du -sh build-projects .ccache 2>/dev/null || true
            if [ -x ./build-projects/bin/scripting_test ]; then
              file ./build-projects/bin/scripting_test || true
              ldd ./build-projects/bin/scripting_test || true
            fi
          ) 2>&1 | tee -a "$LOG_DIR/13-diagnostic-build-outputs.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Test CMake Projects
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 14] Test CMake Projects ==="
            ctest --test-dir build-projects --verbose --output-on-failure --repeat until-pass:99 -E "GoogleTestVerification|VerifyPermissionSkippingOnStart"
          ) 2>&1 | tee -a "$LOG_DIR/14-test-cmake.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Run Stress Tests in GDB
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 15] Run Stress Tests in GDB ==="
            ls -lh ./build-projects/bin/scripting_test || true
            gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"
          ) 2>&1 | tee -a "$LOG_DIR/15-stress-tests-gdb.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Package (Debian/RPM/TGZ)
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 16] Package (Debian/RPM/TGZ) ==="
            cd build-projects
            if command -v dpkg > /dev/null; then
              cpack -V -G DEB
            elif command -v rpmbuild > /dev/null; then
              cpack -V -G RPM
            else
              cpack -V -G TGZ
            fi
            ls -lh *.deb *.rpm *.tar.gz 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/16-package-cpack.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Checkout MkDocs Kit
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 17] Checkout MkDocs Kit ==="
            rm -rf .cache/mkdocs-kit
            mkdir -p .cache
            git clone --depth=1 --verbose https://github.com/mlecabellec/mkdocs-kit.git .cache/mkdocs-kit
            git -C .cache/mkdocs-kit log -1 --oneline || true
          ) 2>&1 | tee -a "$LOG_DIR/17-checkout-mkdocs-kit.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Build Documentation
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          (
            set -e
            set -x
            echo "=== [STEP 18] Build Documentation ==="
            python3 -m venv .venv-docs
            .venv-docs/bin/pip install -v --upgrade pip
            .venv-docs/bin/pip install -v "setuptools<82.0.0"
            .venv-docs/bin/pip install -v ./.cache/mkdocs-kit
            cd doc
            ls -la
            ../.venv-docs/bin/mkdocs-kit build -v
            cp -f mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log" 2>/dev/null || true
            tail -n 80 mkdocs-kit.log 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/18-build-documentation.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: "Diagnostic: Pre-Upload Artifacts Inventory"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR" release-assets
          (
            set -x
            echo "=== [STEP 19] Diagnostic: Pre-Upload Artifacts Inventory ==="
            ls -lh build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz doc/documentation.pdf doc/mkdocs-kit.log 2>/dev/null || true
            ls -la doc/site/ 2>/dev/null || true
            for pkg in build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz; do
              if [ -f "$pkg" ]; then
                cp -f "$pkg" "release-assets/quasar-pkg-archlinux-$(basename "$pkg")"
              fi
            done
            if [ -d doc/site ]; then
              tar -czf "release-assets/quasar-docs-site-archlinux.tar.gz" -C doc site
            fi
            if [ -f doc/documentation.pdf ]; then
              cp -f doc/documentation.pdf "release-assets/quasar-documentation-archlinux.pdf"
            fi
            if [ -f doc/mkdocs-kit.log ]; then
              cp -f doc/mkdocs-kit.log "release-assets/quasar-mkdocs-kit-archlinux.log"
              cp -f doc/mkdocs-kit.log "$LOG_DIR/18-mkdocs-kit-internal.log"
            fi
            ls -lh release-assets/ 2>/dev/null || true
          ) 2>&1 | tee -a "$LOG_DIR/19-pre-upload-inventory.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Upload Artifacts
        id: release-artifacts
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            release-assets/quasar-pkg-archlinux-*
            release-assets/quasar-docs-site-archlinux.tar.gz
            release-assets/quasar-documentation-archlinux.pdf
            release-assets/quasar-mkdocs-kit-archlinux.log

      - name: Configure Linux Modules (EtherCAT)
        continue-on-error: true
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR"
          {
            echo "=== [STEP 20] Upload Artifacts Action Status ==="
            echo "outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
          } | tee -a "$LOG_DIR/20-action-release-artifacts.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
          (
            set -e
            set -x
            echo "=== [STEP 21] Configure Linux Modules (EtherCAT) ==="
            cmake -S linux-modules -B build-modules --log-level=VERBOSE
          ) 2>&1 | tee -a "$LOG_DIR/21-configure-linux-modules.log" "$LOG_DIR/quasar-archlinux-full-execution.log"

      - name: Save ccache
        id: ccache-save
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: archlinux-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          set -e -o pipefail
          LOG_DIR="/tmp/quasar-ci-logs-archlinux"
          mkdir -p "$LOG_DIR" ci-logs
          for extra_log in \
            build-projects/CMakeFiles/CMakeConfigureLog.yaml \
            build-projects/Testing/Temporary/LastTest.log \
            build-projects/Testing/Temporary/LastTestsFailed.log \
            build-modules/CMakeFiles/CMakeConfigureLog.yaml \
            doc/mkdocs-kit.log; do
            if [ -f "$extra_log" ]; then
              cp -f "$extra_log" "$LOG_DIR/$(echo "$extra_log" | tr '/' '_')" 2>/dev/null || true
            fi
          done
          {
            echo "=== [STEP 22] Action Steps Status Summary (archlinux) ==="
            echo "push-first-analysis-logs: outcome=${{ steps.push-first-analysis-logs.outcome }} conclusion=${{ steps.push-first-analysis-logs.conclusion }}"
            echo "checkout-quasar:          outcome=${{ steps.checkout-quasar.outcome }} conclusion=${{ steps.checkout-quasar.conclusion }}"
            echo "ccache-restore:           outcome=${{ steps.ccache-restore.outcome }} conclusion=${{ steps.ccache-restore.conclusion }}"
            echo "release-artifacts:        outcome=${{ steps.release-artifacts.outcome }} conclusion=${{ steps.release-artifacts.conclusion }}"
            echo "ccache-save:              outcome=${{ steps.ccache-save.outcome }} conclusion=${{ steps.ccache-save.conclusion }}"
          } | tee -a "$LOG_DIR/22-action-steps-summary.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
          (
            echo "=== [STEP 23] Diagnostic: Post-Run Summary (archlinux) ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo "Job Status: ${{ job.status }}"
            free -h || true
            df -h . || true
            du -sh * .cache .ccache .venv-docs build-* 2>/dev/null || true
            ccache -s 2>/dev/null || true
            ls -la
            ls -lh "$LOG_DIR" || true
          ) 2>&1 | tee -a "$LOG_DIR/23-post-run-summary.log" "$LOG_DIR/quasar-archlinux-full-execution.log"
          cp -f "$LOG_DIR/quasar-archlinux-full-execution.log" "ci-logs/quasar-archlinux-full-execution.log"
          tar -czf "ci-logs/quasar-archlinux-full-logs.tar.gz" -C "$LOG_DIR" .
          ls -lh ci-logs/

      - name: Push Full Execution Logs
        id: push-full-execution-logs
        if: always()
        continue-on-error: true
        uses: https://gitea.com/actions/gitea-release-action@v1
        env:
          NODE_OPTIONS: "--experimental-fetch"
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ci-run-${{ gitea.run_id }}
          target_commitish: ${{ gitea.sha }}
          name: "Quasar CI & Docs Run #${{ gitea.run_id }} (${{ gitea.ref_name }})"
          body: "Automated Quasar CI/CD release for commit ${{ gitea.sha }} (ref: ${{ gitea.ref_name }}, run #${{ gitea.run_id }}). Contains build packages, mkdocs-kit documentation, first-step analysis logs, and full execution logs."
          draft: false
          prerelease: false
          files: |-
            ci-logs/quasar-archlinux-full-execution.log
            ci-logs/quasar-archlinux-full-logs.tar.gz
