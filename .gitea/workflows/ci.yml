          pkg-config --list-all 2>/dev/null | grep -iE 'alsa|x11|gl|ssl|zstd|uuid|curl|yaml|tinyxml|zlib|pango' | sort || true

      - name: ccache cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .ccache
          key: fedora-ccache-${{ gitea.sha }}
          restore-keys: |
            fedora-ccache-

      - name: "Diagnostic: Pre-Configure ccache & CMake Environment"
        run: |
          set -x
          ls -la .ccache 2>/dev/null || true
          ccache -s || true
          head -n 40 cmake-projects/CMakeLists.txt || true

      - name: Configure CMake Projects
        run: |
          set -x
          mkdir -p .ccache build-projects
          cmake -S cmake-projects -B build-projects \
                --log-level=VERBOSE \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_VERBOSE_MAKEFILE=ON \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_POLICY_DEFAULT_CMP0000=NEW \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_SHARED_LINKER_FLAGS="-lzstd" \
                -DCMAKE_EXE_LINKER_FLAGS="-lzstd"
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Post-Configure CMake Cache & Discovered Tests"
        run: |
          echo "=== CMakeCache.txt Key Entries ==="
          grep -E '^(CMAKE_(C|CXX)_COMPILER|CMAKE_BUILD_TYPE|CMAKE_.*_LAUNCHER|CMAKE_GENERATOR|CMAKE_VERBOSE_MAKEFILE|CMAKE_SHARED_LINKER_FLAGS|CMAKE_EXE_LINKER_FLAGS)' build-projects/CMakeCache.txt || true
          echo "=== Discovered CTest Cases ==="
          ctest --test-dir build-projects -N || true

      - name: Build CMake Projects
        run: |
          set -x
          ccache -z
          cmake --build build-projects --parallel $(nproc) --verbose
          ccache -s
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/.ccache

      - name: "Diagnostic: Build Outputs & Binaries Inspection"
        run: |
          set -x
          ls -la build-projects
          ls -la build-projects/bin 2>/dev/null || true
          ls -la build-projects/lib 2>/dev/null || true
          du -sh build-projects .ccache 2>/dev/null || true
          if [ -x ./build-projects/bin/scripting_test ]; then
            file ./build-projects/bin/scripting_test || true
            ldd ./build-projects/bin/scripting_test || true
          fi

      - name: Test CMake Projects
        run: |
          set -x
          ctest --test-dir build-projects --verbose --output-on-failure --repeat until-pass:99 -E "GoogleTestVerification|VerifyPermissionSkippingOnStart"

      - name: Run Stress Tests in GDB
        continue-on-error: true
        run: |
          set -x
          ls -lh ./build-projects/bin/scripting_test || true
          gdb -batch -ex "run" -ex "bt full" -ex "quit" --args ./build-projects/bin/scripting_test --gtest_filter="ScriptManagerTest.MemoryStress:LuaServiceTest.FullLifecycle"

      - name: Package (Debian/RPM/TGZ)
        run: |
          set -x
          cd build-projects
          if command -v dpkg > /dev/null; then
            cpack -V -G DEB
          elif command -v rpmbuild > /dev/null; then
            cpack -V -G RPM
          else
            cpack -V -G TGZ
          fi
          ls -lh *.deb *.rpm *.tar.gz 2>/dev/null || true
          for pkg in *.rpm; do [ -f "$pkg" ] && rpm -qip "$pkg" || true; done

      - name: Checkout MkDocs Kit
        continue-on-error: true
        run: |
          set -x
          rm -rf .cache/mkdocs-kit
          mkdir -p .cache
          git clone --depth=1 --verbose https://github.com/mlecabellec/mkdocs-kit.git .cache/mkdocs-kit
          git -C .cache/mkdocs-kit log -1 --oneline || true

      - name: Build Documentation
        continue-on-error: true
        run: |
          set -x
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install -v --upgrade pip
          .venv-docs/bin/pip install -v "setuptools<82.0.0"
          .venv-docs/bin/pip install -v ./.cache/mkdocs-kit
          cd doc
          ls -la
          ../.venv-docs/bin/mkdocs-kit build -v
          tail -n 80 mkdocs-kit.log 2>/dev/null || true

      - name: "Diagnostic: Pre-Upload Artifacts Inventory"
        if: always()
        run: |
          set -x
          ls -lh build-projects/*.deb build-projects/*.rpm build-projects/*.tar.gz doc/documentation.pdf doc/mkdocs-kit.log 2>/dev/null || true
          ls -la doc/site/ 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: quasar-pkg-fedora
          path: |
            build-projects/*.deb
            build-projects/*.rpm
            build-projects/*.tar.gz
            doc/site/
            doc/documentation.pdf

      - name: Configure Linux Modules (EtherCAT)
        continue-on-error: true
        run: |
          set -x
          cmake -S linux-modules -B build-modules --log-level=VERBOSE

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          echo "Job Status: ${{ job.status }}"
          df -h . || true
          du -sh * .cache .ccache .venv-docs build-* 2>/dev/null || true
          ccache -s 2>/dev/null || true
          ls -la

  build-archlinux:
    name: Build, Test & Package (archlinux)
    needs: runner-diagnostics
    runs-on: archlinux
    if: always() && startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')
    continue-on-error: true

    steps:
      - name: "Diagnostic: Environment, Pre-Matrix & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_JOB: ${{ toJSON(job) }}
          CTX_NEEDS: ${{ toJSON(needs) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          echo "=== UTC Timestamp ==="
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          echo "=== Host / Container OS & Hardware ==="
          cat /etc/os-release 2>/dev/null || true
          uname -a
          hostname -f 2>/dev/null || hostname || true
          id
          pwd
          nproc || true
          free -h || true
          df -hT . || true
          cat /run/.containerenv 2>/dev/null || ls -la /.dockerenv 2>/dev/null || true
          cat /proc/1/cgroup 2>/dev/null || true
          cat /etc/resolv.conf 2>/dev/null || true
          echo "=== Pre-Matrix Discovery Outputs (needs) ==="
          printf '%s\n' "$CTX_NEEDS"
          echo "=== Runner & Job Context ==="
          printf '%s\n' "$CTX_RUNNER"
          printf '%s\n' "$CTX_JOB"
          echo "=== Strategy / Matrix Context ==="
          printf '%s\n' "$CTX_STRATEGY"
          printf '%s\n' "$CTX_MATRIX"
          echo "=== Gitea Context (token redacted) ==="
          printf '%s\n' "$CTX_GITEA" | sed -E 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'
          echo "=== Environment Variables (redacted) ==="
          unset CTX_RUNNER CTX_JOB CTX_NEEDS CTX_STRATEGY CTX_MATRIX CTX_GITEA
          env | sort | sed -E 's/^([^=]*(TOKEN|SECRET|PASSWORD|PASSWD|KEY|AUTH)[^=]*)=.*/\1=***/I'

      - name: Install Node.js and Git Prerequisites (Arch Linux)
        run: |
          set -x
          pacman -Sy --noconfirm nodejs git ca-certificates
          node --version
          git --version

      - name: Checkout Quasar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Diagnostic: Post-Checkout Git & Submodule State"
        run: |
          set -x
          ls -la
          git status -sb || true
          git branch -a || true
          git remote -v || true
          git log -n 5 --oneline --decorate || true
          git submodule status --recursive || true
          ls -la cmake-projects doc linux-modules 2>/dev/null || true

      - name: Install dependencies (Arch Linux)
        run: |
          set -x
          pacman -S --needed --noconfirm \
                         base-devel cmake python file \
                         linux-headers autoconf automake libtool dkms \
                         alsa-lib libx11 libxrandr libxi mesa glu libxcursor libxinerama \
                         gmp openssl util-linux-libs zlib binutils yaml-cpp tinyxml2 ccache gdb \
                         curl npm python-pip plantuml graphviz jre-openjdk pango cairo

      - name: "Diagnostic: Workspace, Toolchain, Compilers & Libraries Check"
